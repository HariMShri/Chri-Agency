  const [statusFilter, setStatusFilter] = useState('All');
  const [paidIds, setPaidIds] = useState(() => new Set()); // session-only "marked as paid" markers — see note below
  const [payoutTarget, setPayoutTarget] = useState(null); // employee row currently open in the "Disburse" modal

  const [start, end] = getRange(preset, customStart, customEnd);
  const list = employees.filter((e) => (companyFilter === 'All' || e.company === companyFilter) && (statusFilter === 'All' || e.status === statusFilter));
  const inactiveCount = employees.filter((e) => e.status === 'Inactive').length;

  const rows = list.map((e) => {
    const es = entries.filter((en) => en.employeeId === e.id && inRange(en.date, start, end));
    const delivered = es.reduce((s, en) => s + en.delivered, 0);
    const days = es.length;
    const { pay, petrol: petrolPerDay } = calcPayroll(delivered, e, rates);
    const petrol = petrolPerDay * days;
    return { ...e, delivered, days, pay, petrol, total: pay + petrol };
  });

  const totals = rows.reduce((acc, r) => ({ pay: acc.pay + r.pay, petrol: acc.petrol + r.petrol, total: acc.total + r.total, delivered: acc.delivered + r.delivered }), { pay: 0, petrol: 0, total: 0, delivered: 0 });

  const markPaid = (id) => setPaidIds((prev) => new Set(prev).add(id));

  const tableControls = useTableControls();
  const salaryColumns = [
    { key: 'name', label: 'Employee', getValue: (r) => r.name, filterType: 'text' },
    { key: 'company', label: 'Company', getValue: (r) => r.company, filterType: 'select', filterOptions: COMPANIES },
    { key: 'status', label: 'Status', getValue: (r) => r.status, filterType: 'select', filterOptions: ['Active', 'Inactive'] },
    { key: 'method', label: 'Method', getValue: (r) => findSalaryStructure(rates, r.salaryMethod).label || '—', filterType: 'text' },
    { key: 'rate', label: 'Salary rate', getValue: (r) => findSalaryStructure(rates, r.salaryMethod).perDelivery, filterType: 'text' },
    { key: 'days', label: 'Working days', getValue: (r) => r.days, filterType: 'text' },
    { key: 'delivered', label: 'Delivered', getValue: (r) => r.delivered, filterType: 'text' },
    { key: 'pay', label: 'Payroll', getValue: (r) => r.pay, filterType: 'text' },
    { key: 'petrol', label: 'Petrol', getValue: (r) => r.petrol, filterType: 'text' },
    { key: 'total', label: 'Total salary', getValue: (r) => r.total, filterType: 'text' },
    { key: 'bank', label: 'Bank / UPI', getValue: (r) => r.upiId || r.bankAccountNumber || r.bankAccountName || '', filterType: 'text' },
  ];
  const visibleRows = tableControls.apply(rows, salaryColumns);

  // Exports a bank-portal-ready payout file: most Indian business/current accounts let you bulk-upload
  // a CSV like this (Account No, IFSC, Name, Amount, Narration) to pay many employees via NEFT/IMPS in
  // one batch, without needing a payment-gateway API integration.
  const exportBankFile = () => {
    const payable = visibleRows.filter((r) => r.total > 0);
    const header = ['Beneficiary name', 'Account number', 'IFSC', 'UPI ID', 'Amount (INR)', 'Narration'];
    const csvRows = payable.map((r) => [
      r.bankAccountName || r.name, r.bankAccountNumber || '', r.bankIfsc || '', r.upiId || '',
      r.total.toFixed(2), `Salary ${preset}`,
    ]);
    downloadCsv(`salary_payout_${toISO(today())}.csv`, [header, ...csvRows]);
  };

  return (
    <div>
      <SectionHeader
        title="Salary management"
        subtitle="Automatically calculated from daily delivery records and each employee's salary method"
        right={
          <div className="no-print" style={{ display: 'flex', gap: 6 }}>
            <button className={`edm-tab ${tab === 'overview' ? 'edm-tab-active' : ''}`} onClick={() => setTab('overview')}>Overview</button>
            <button className={`edm-tab ${tab === 'payslips' ? 'edm-tab-active' : ''}`} onClick={() => setTab('payslips')}>Pay slips</button>
          </div>
        }
      />

      {tab === 'payslips' ? (
        <PayslipsTab employees={employees} entries={entries} rates={rates} />
      ) : (
      <>
      <FilterBar preset={preset} setPreset={setPreset} customStart={customStart} customEnd={customEnd} setCustomStart={setCustomStart} setCustomEnd={setCustomEnd}
        employeeFilter="All" setEmployeeFilter={() => {}} employees={[]} showEmployee={false}
        companyFilter={companyFilter} setCompanyFilter={setCompanyFilter} />

      <div style={{ display: 'flex', gap: 8, marginBottom: 16, alignItems: 'center', flexWrap: 'wrap' }}>
        <span className="edm-label" style={{ marginBottom: 0 }}>Employee status</span>
        {['All', 'Active', 'Inactive'].map((s) => (
          <button key={s} className={`edm-btn ${statusFilter === s ? 'edm-btn-primary' : 'edm-btn-ghost'}`} onClick={() => setStatusFilter(s)}>
            {s}{s === 'Inactive' && inactiveCount > 0 ? ` (${inactiveCount})` : ''}
          </button>
        ))}
      </div>

      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, minmax(0,1fr))', gap: 14, marginBottom: 20 }}>
        <MetricCard label="Payroll (piece rate)" value={inr(totals.pay)} icon={Wallet} tone="navy" />
        <MetricCard label="Petrol allowance" value={inr(totals.petrol)} icon={Fuel} tone="amber" />
        <MetricCard label="Total salary payable" value={inr(totals.total)} icon={TrendingUp} tone="teal" />
      </div>

      <div className="edm-card" style={{ padding: 16, marginBottom: 16, display: 'flex', gap: 24, flexWrap: 'wrap', fontSize: 13 }}>
        {(rates.salaryStructures || []).map((s) => (
          <div key={s.id}>
            <span style={{ color: 'var(--text-muted)' }}>{s.label}: </span>
            <span style={{ fontWeight: 600 }}>₹{s.perDelivery} per delivery{s.petrol ? ` + ₹${s.petrol} petrol / working day` : ', no petrol'}</span>
          </div>
        ))}
      </div>

      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: 8, marginBottom: 10 }}>
        <span className="edm-label" style={{ marginBottom: 0 }}>Payroll ({visibleRows.length} employee{visibleRows.length === 1 ? '' : 's'})</span>
        <button className="edm-btn edm-btn-ghost" onClick={exportBankFile}><Download size={14} /> Export bank payout file (CSV)</button>
      </div>

      <div className="edm-card edm-scroll" style={{ overflowX: 'auto' }}>
        <table className="edm-table">
          <SortFilterHead columns={salaryColumns} controls={tableControls} extraEnd={<th>Payout</th>} />
          <tbody>
            {visibleRows.map((r) => {
              const structure = findSalaryStructure(rates, r.salaryMethod);
              return (
              <tr key={r.id}>
                <td style={{ fontWeight: 600 }}>{r.name}</td>
                <td>{r.company}</td>
                <td><StatusBadge status={r.status} /></td>
                <td>{structure.label || '—'}</td>
                <td className="font-mono">₹{structure.perDelivery}/delivery{structure.petrol ? ` +₹${structure.petrol}/day` : ''}</td>
                <td className="font-mono">{r.days}</td>
                <td className="font-mono">{r.delivered}</td>
                <td className="font-mono">{inr(r.pay)}</td>
                <td className="font-mono">{inr(r.petrol)}</td>
                <td className="font-mono" style={{ fontWeight: 700 }}>{inr(r.total)}</td>
                <td><BankCell employee={r} /></td>
                <td>
                  {paidIds.has(r.id) ? (
                    <span className="edm-badge edm-badge-active"><CheckCircle2 size={11} /> Paid</span>
                  ) : (
                    <button
                      className="edm-btn edm-btn-ghost"
                      style={{ padding: '5px 10px', fontSize: 12 }}
                      disabled={r.total <= 0 || !hasPayoutDetails(r)}
                      onClick={() => setPayoutTarget(r)}
                    >
                      Disburse
                    </button>
                  )}
                </td>
              </tr>
              );
            })}
            {visibleRows.length === 0 && <tr><td colSpan={12} style={{ textAlign: 'center', color: 'var(--text-muted)', padding: 24 }}>No employees in this view.</td></tr>}
          </tbody>
        </table>
      </div>
      </>
      )}

      {payoutTarget && (
        <Modal title={`Pay ${payoutTarget.name}`} onClose={() => setPayoutTarget(null)} width={420}>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
            <div className="edm-card" style={{ padding: 14, fontSize: 13 }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 6 }}>
                <span style={{ color: 'var(--text-muted)' }}>Amount due</span>
                <span className="font-mono" style={{ fontWeight: 700 }}>{inr(payoutTarget.total)}</span>
              </div>
              <div style={{ display: 'flex', justifyContent: 'space-between' }}>
                <span style={{ color: 'var(--text-muted)' }}>Payout route</span>
                <BankCell employee={payoutTarget} />
              </div>
            </div>

            {payoutTarget.upiId ? (
              <a
                className="edm-btn edm-btn-amber"
                style={{ justifyContent: 'center' }}
                href={buildUpiLink({ upiId: payoutTarget.upiId, payeeName: payoutTarget.bankAccountName || payoutTarget.name, amount: payoutTarget.total, note: `Salary ${preset}` })}
              >
                Open in UPI app to pay {inr(payoutTarget.total)}
              </a>
            ) : (
              <p style={{ fontSize: 12.5, color: 'var(--text-muted)', margin: 0 }}>
                No UPI ID on file — use the bank details above for an NEFT/IMPS transfer from your banking app, or add this employee to the bank payout file export.
              </p>
            )}

            <p style={{ fontSize: 11.5, color: 'var(--text-muted)', margin: 0 }}>
              This opens your own UPI app or bank portal to complete the transfer — Claude.ai can't move money directly.
              "Mark as paid" is just a note for this screen and isn't a real payment confirmation.
            </p>

            <div style={{ display: 'flex', gap: 8 }}>
              <button className="edm-btn edm-btn-primary" style={{ flex: 1, justifyContent: 'center' }} onClick={() => { markPaid(payoutTarget.id); setPayoutTarget(null); }}>
                Mark as paid
              </button>
              <button className="edm-btn edm-btn-ghost" onClick={() => setPayoutTarget(null)}>Cancel</button>
            </div>
          </div>
        </Modal>
      )}
    </div>
  );
}

/* ---------------------------------- Reports page (shared across levels) ---------------------------------- */

const REPORT_META = {
  daily: { title: 'Daily reports', subtitle: 'A single day at a glance, per employee and company', defaultPreset: 'today' },
  weekly: { title: 'Weekly reports', subtitle: 'Weekly totals, employee rankings, and company comparison', defaultPreset: 'thisWeek' },
  monthly: { title: 'Monthly reports', subtitle: 'Monthly statistics, profit and loss, and best performers', defaultPreset: 'thisMonth' },
  yearly: { title: 'Yearly reports', subtitle: 'Annual overview with monthly comparison', defaultPreset: 'thisYear' },
};

function ReportPage({ level, employees, entries, empById, rates, vendors = [] }) {
  const COMPANIES = useContext(CompaniesContext);
  const meta = REPORT_META[level];
  const [preset, setPreset] = useState(meta.defaultPreset);
  const [customStart, setCustomStart] = useState(toISO(today()));
  const [customEnd, setCustomEnd] = useState(toISO(today()));
  const [employeeFilter, setEmployeeFilter] = useState('All');
  const [companyFilter, setCompanyFilter] = useState('All');
  const [vendorFilter, setVendorFilter] = useState('All');

  // Auto-update preset when report level changes (Daily/Weekly/Monthly/Yearly)
  useEffect(() => {
    setPreset(meta.defaultPreset);
  }, [level]);

  const vendorEmployeeIds = useMemo(() => {
    if (vendorFilter === 'All') return null;
    const v = vendors.find((x) => x.id === vendorFilter);
    return new Set(v ? v.employeeIds || [] : []);
  }, [vendorFilter, vendors]);

  const [start, end] = getRange(preset, customStart, customEnd);
  const filtered = entries.filter((en) =>
    inRange(en.date, start, end) &&
    (companyFilter === 'All' || en.company === companyFilter) &&
    (employeeFilter === 'All' || en.employeeId === employeeFilter) &&
    (!vendorEmployeeIds || vendorEmployeeIds.has(en.employeeId))
  );

  const overall = aggregate(filtered, empById, rates);
  const trend = buildTrend(filtered, empById, rates, start, end, vendors);
  const vendorPayout = totalVendorPayout(vendors, filtered);
  const netProfit = overall.profit - vendorPayout;
  const netMargin = overall.revenue ? (netProfit / overall.revenue) * 100 : 0;

  const empPerf = employees.map((e) => {
    const es = filtered.filter((en) => en.employeeId === e.id);
    const a = aggregate(es, empById, rates);
    return { ...e, ...a };
  }).filter((e) => e.assigned > 0).sort((a, b) => b.delivered - a.delivered).map((e, i) => ({ ...e, rank: i + 1 }));

  const rankingControls = useTableControls();
  const rankingColumns = [
    { key: 'rank', label: '#', getValue: (e) => e.rank, filterType: 'none' },
    { key: 'name', label: 'Employee', getValue: (e) => e.name, filterType: 'text' },
    { key: 'delivered', label: 'Delivered', getValue: (e) => e.delivered, filterType: 'text' },
    { key: 'successRate', label: 'Success', getValue: (e) => e.successRate, filterType: 'text' },
    { key: 'salary', label: 'Salary', getValue: (e) => e.payroll + e.petrol, filterType: 'text' },
  ];
  const visibleEmpPerf = rankingControls.apply(empPerf, rankingColumns);

  const companyPerf = COMPANIES.map((c) => {
    const ce = filtered.filter((en) => en.company === c);
    const agg = aggregate(ce, empById, rates);
    const cVendorPayout = totalVendorPayout(vendors, ce);
    return { company: c, ...agg, vendorPayout: cVendorPayout, netProfit: agg.profit - cVendorPayout };
  });

  const rangeLabel = start.getTime() === end.getTime()
    ? start.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' })
    : `${start.toLocaleDateString('en-IN', { day: '2-digit', month: 'short' })} – ${end.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' })}`;

  // Exports everything on screen — the overall summary, the (currently sorted/filtered) employee
  // rankings, and the company-wise breakdown — as one CSV, so the report can be shared or archived
  // outside the dashboard.
  const exportReportCsv = () => {
    const vendorLabel = vendorFilter === 'All' ? 'All vendors' : (vendors.find((v) => v.id === vendorFilter)?.name || 'All vendors');
    const rows = [
      [meta.title],
      ['Range', rangeLabel],
      ['Vendor', vendorLabel],
      [],
      ['Summary'],
      ['Assigned', overall.assigned],
      ['Delivered', overall.delivered],
      ['Failed', overall.failed],
      ['Success rate', pct(overall.successRate)],
      ['Revenue (₹)', Math.round(overall.revenue)],
      ['Payroll (₹)', Math.round(overall.payroll)],
      ['Petrol allowance (₹)', Math.round(overall.petrol)],
      ['Vendor payout (₹)', Math.round(vendorPayout)],
      ['Profit (₹)', Math.round(netProfit)],
      ['Margin', pct(netMargin)],
      [],
      ['Employee rankings'],
      ['#', 'Employee ID', 'Employee', 'Company', 'Status', 'Assigned', 'Delivered', 'Failed', 'Success %', 'Revenue (₹)', 'Payroll (₹)', 'Petrol (₹)', 'Total salary (₹)'],
      ...visibleEmpPerf.map((e) => [
        e.rank, e.id, e.name, e.company, e.status,
        e.assigned, e.delivered, e.failed, e.successRate.toFixed(1),
        Math.round(e.revenue), Math.round(e.payroll), Math.round(e.petrol), Math.round(e.payroll + e.petrol),
      ]),
      [],
      ['Company-wise performance'],
      ['Company', 'Assigned', 'Delivered', 'Failed', 'Success %', 'Revenue (₹)', 'Expense (₹)', 'Vendor payout (₹)', 'Profit (₹)'],
      ...companyPerf.map((c) => [
        c.company, c.assigned, c.delivered, c.failed, c.successRate.toFixed(1),
        Math.round(c.revenue), Math.round(c.totalExpense), Math.round(c.vendorPayout), Math.round(c.netProfit),
      ]),
    ];
    downloadCsv(`${level}_report_${toISO(start)}_to_${toISO(end)}.csv`, rows);
  };

  return (
    <div>
      <SectionHeader
        title={meta.title}
        subtitle={meta.subtitle}
        right={<button className="edm-btn edm-btn-ghost" onClick={exportReportCsv}><Download size={15} /> Export CSV</button>}
      />

      <FilterBar preset={preset} setPreset={setPreset} customStart={customStart} customEnd={customEnd} setCustomStart={setCustomStart} setCustomEnd={setCustomEnd}
        employeeFilter={employeeFilter} setEmployeeFilter={setEmployeeFilter} employees={employees}
        companyFilter={companyFilter} setCompanyFilter={setCompanyFilter}
        vendors={vendors} vendorFilter={vendorFilter} setVendorFilter={setVendorFilter} showVendor={vendors.length > 0} />

      <div className="edm-card" style={{ padding: '10px 16px', marginBottom: 16, display: 'flex', alignItems: 'center', gap: 8, fontSize: 12.5, color: 'var(--text-muted)' }}>
        <ChevronRight size={13} /> Showing <strong style={{ color: 'var(--text)' }}>{rangeLabel}</strong>
      </div>

      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, minmax(0,1fr))', gap: 14, marginBottom: 20 }}>
        <MetricCard label="Deliveries completed" value={overall.delivered.toLocaleString('en-IN')} sub={`of ${overall.assigned} assigned`} icon={Package} tone="teal" />
        <MetricCard label="Failed deliveries" value={overall.failed} sub={pct(100 - overall.successRate) + ' failure rate'} icon={XCircle} tone="danger" />
        <MetricCard label="Revenue earned" value={inr(overall.revenue)} icon={TrendingUp} tone="navy" />
        <MetricCard
          label="Profit"
          value={inr(netProfit)}
          sub={vendorPayout > 0 ? `${netMargin.toFixed(1)}% margin · after ${inr(vendorPayout)} vendor payout` : `${netMargin.toFixed(1)}% margin`}
          icon={Wallet}
          tone={netProfit >= 0 ? 'teal' : 'danger'}
        />
      </div>

      <div className="edm-card" style={{ padding: 18, marginBottom: 20 }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 12 }}>
          <h3 className="font-display" style={{ fontSize: 15, fontWeight: 700, margin: 0 }}>Deliveries and profit trend</h3>
          <RouteProgress percent={overall.successRate} width={110} />
        </div>
        <div className="chart-box">
          <ResponsiveContainer width="100%" height="100%">
            <ComposedChart data={trend} margin={{ left: -10, right: 10 }}>
              <CartesianGrid stroke="#EEF0F2" vertical={false} />
              <XAxis dataKey="label" tick={{ fontSize: 11, fill: '#6B7280' }} axisLine={{ stroke: '#E4E6EA' }} tickLine={false} interval={Math.ceil(trend.length / 12)} />
              <YAxis tick={{ fontSize: 11, fill: '#6B7280' }} axisLine={false} tickLine={false} />
              <Tooltip contentStyle={{ fontSize: 12, borderRadius: 8, border: '1px solid #E4E6EA' }} />
              <Legend wrapperStyle={{ fontSize: 12 }} />
              <Bar dataKey="delivered" name="Delivered" fill="#0E9488" radius={[3, 3, 0, 0]} maxBarSize={16} />
              <Bar dataKey="failed" name="Failed" fill="#DC5B5B" radius={[3, 3, 0, 0]} maxBarSize={16} />
              <Line dataKey="profit" name="Profit (₹)" stroke="#E8963C" strokeWidth={2} dot={false} />
            </ComposedChart>
          </ResponsiveContainer>
        </div>
      </div>

      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 16, marginBottom: 20 }}>
        <div className="edm-card" style={{ padding: 18 }}>
          <h3 className="font-display" style={{ fontSize: 15, fontWeight: 700, margin: '0 0 12px' }}>Employee rankings</h3>
          <div className="edm-scroll" style={{ maxHeight: 280, overflowY: 'auto' }}>
            <table className="edm-table">
              <SortFilterHead columns={rankingColumns} controls={rankingControls} />
              <tbody>
                {visibleEmpPerf.map((e) => (
                  <tr key={e.id}>
                    <td className="font-mono" style={{ color: 'var(--text-muted)' }}>{e.rank}</td>
                    <td style={{ fontWeight: 600 }}>{e.name}</td>
                    <td className="font-mono">{e.delivered}</td>
                    <td className="font-mono">{pct(e.successRate)}</td>
                    <td className="font-mono">{inr(e.payroll + e.petrol)}</td>
                  </tr>
                ))}
                {visibleEmpPerf.length === 0 && <tr><td colSpan={5} style={{ textAlign: 'center', color: 'var(--text-muted)', padding: 20 }}>{empPerf.length === 0 ? 'No activity in this range.' : 'No employees match the current filters.'}</td></tr>}
              </tbody>
            </table>
          </div>
        </div>

        <div className="edm-card" style={{ padding: 18 }}>
          <h3 className="font-display" style={{ fontSize: 15, fontWeight: 700, margin: '0 0 12px' }}>Company-wise performance</h3>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
            {companyPerf.map((c) => (
              <div key={c.company} style={{ padding: 12, borderRadius: 10, background: '#F7F8FA' }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 8 }}>
                  <span style={{ fontWeight: 600, fontSize: 13.5 }}>{c.company}</span>
                  <span className="font-mono" style={{ fontWeight: 700, fontSize: 13.5, color: c.netProfit >= 0 ? 'var(--teal-dark)' : 'var(--danger)' }}>{inr(c.netProfit)}</span>
                </div>
                <RouteProgress percent={c.successRate} width={140} />
                <div style={{ display: 'flex', gap: 16, marginTop: 8, fontSize: 12, color: 'var(--text-muted)' }}>
                  <span>Delivered: <strong className="font-mono" style={{ color: 'var(--text)' }}>{c.delivered}</strong></span>
                  <span>Revenue: <strong className="font-mono" style={{ color: 'var(--text)' }}>{inr(c.revenue)}</strong></span>
                </div>
              </div>
            ))}
          </div>
        </div>
      </div>

      {empPerf.length > 0 && (
        <div className="edm-card" style={{ padding: 18 }}>
          <h3 className="font-display" style={{ fontSize: 15, fontWeight: 700, margin: '0 0 12px' }}>Best-performing employees</h3>
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, minmax(0,1fr))', gap: 12 }}>
            {empPerf.slice(0, 3).map((e, i) => (
              <div key={e.id} className="edm-card" style={{ padding: 14, border: i === 0 ? '1.5px solid var(--amber)' : '1px solid var(--border)' }}>
                <div style={{ fontSize: 11, color: 'var(--text-muted)', fontWeight: 600, marginBottom: 4 }}>RANK {i + 1}</div>
                <div style={{ fontWeight: 700, fontSize: 14, marginBottom: 6 }}>{e.name}</div>
                <div style={{ fontSize: 12, color: 'var(--text-muted)' }}>{e.delivered} delivered · {pct(e.successRate)} success</div>
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

/* ---------------------------------- Profit & Loss page ---------------------------------- */

function PnLPage({ employees, entries, empById, rates, vendors = [] }) {
  const COMPANIES = useContext(CompaniesContext);
  const [preset, setPreset] = useState('thisMonth');
  const [customStart, setCustomStart] = useState(toISO(today()));
  const [customEnd, setCustomEnd] = useState(toISO(today()));
  const [companyFilter, setCompanyFilter] = useState('All');

  const [start, end] = getRange(preset, customStart, customEnd);
  const filtered = entries.filter((en) => inRange(en.date, start, end) && (companyFilter === 'All' || en.company === companyFilter));
  const a = aggregate(filtered, empById, rates);
  const vendorPayout = totalVendorPayout(vendors, filtered);
  const netProfit = a.profit - vendorPayout;
  const netMargin = a.revenue ? (netProfit / a.revenue) * 100 : 0;

  // Vendor payout per company too — an entry already carries its own company, so this stays
  // accurate even though a vendor's employees can be split across companies.
  const companyRows = COMPANIES.map((c) => {
    const ce = filtered.filter((en) => en.company === c);
    const agg = aggregate(ce, empById, rates);
    const cVendorPayout = totalVendorPayout(vendors, ce);
    return { company: c, ...agg, vendorPayout: cVendorPayout, netProfit: agg.profit - cVendorPayout };
  });

  const Row = ({ label, value, bold, tone }) => (
    <div style={{ display: 'flex', justifyContent: 'space-between', padding: '10px 0', borderBottom: '1px solid #EEF0F2' }}>
      <span style={{ fontSize: 13.5, color: bold ? 'var(--text)' : 'var(--text-muted)', fontWeight: bold ? 700 : 400 }}>{label}</span>
      <span className="font-mono" style={{ fontSize: bold ? 15 : 13.5, fontWeight: bold ? 700 : 600, color: tone === 'danger' ? 'var(--danger)' : tone === 'teal' ? 'var(--teal-dark)' : 'var(--text)' }}>{value}</span>
    </div>
  );

  return (
    <div>
      <SectionHeader title="Profit and loss" subtitle="Revenue minus salary expense, for the selected period" />

      <FilterBar preset={preset} setPreset={setPreset} customStart={customStart} customEnd={customEnd} setCustomStart={setCustomStart} setCustomEnd={setCustomEnd}
        employeeFilter="All" setEmployeeFilter={() => {}} employees={[]} showEmployee={false}
        companyFilter={companyFilter} setCompanyFilter={setCompanyFilter} />

      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 16 }}>
        <div className="edm-card" style={{ padding: 20 }}>
          <h3 className="font-display" style={{ fontSize: 15, fontWeight: 700, margin: '0 0 6px' }}>Statement</h3>
          <Row label="Revenue" value={inr(a.revenue)} tone="teal" />
          <Row label="Payroll" value={`(${inr(a.payroll)})`} />
          <Row label="Petrol allowance" value={`(${inr(a.petrol)})`} />
          {vendorPayout > 0 && <Row label="Vendor payout" value={`(${inr(vendorPayout)})`} />}
          <Row label="Total expenses" value={`(${inr(a.totalExpense + vendorPayout)})`} />
          <div style={{ paddingTop: 12 }}>
            <Row label="Net profit" value={inr(netProfit)} bold tone={netProfit >= 0 ? 'teal' : 'danger'} />
          </div>
          <div style={{ display: 'flex', justifyContent: 'space-between', paddingTop: 10 }}>
            <span style={{ fontSize: 13, color: 'var(--text-muted)' }}>Profit margin</span>
            <span className="font-mono" style={{ fontWeight: 700 }}>{pct(netMargin)}</span>
          </div>
        </div>

        <div className="edm-card" style={{ padding: 20 }}>
          <h3 className="font-display" style={{ fontSize: 15, fontWeight: 700, margin: '0 0 14px' }}>Company comparison</h3>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
            {companyRows.map((c) => (
              <div key={c.company}>
                <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 6 }}>
                  <span style={{ fontWeight: 600, fontSize: 13.5 }}>{c.company}</span>
                  <span className="font-mono" style={{ fontWeight: 700, color: c.netProfit >= 0 ? 'var(--teal-dark)' : 'var(--danger)' }}>{inr(c.netProfit)}</span>
                </div>
                <div style={{ display: 'flex', height: 8, borderRadius: 4, overflow: 'hidden', background: '#EEF0F2' }}>
                  <div style={{ width: `${c.revenue ? Math.min(100, ((c.totalExpense + c.vendorPayout) / c.revenue) * 100) : 0}%`, background: 'var(--amber)' }} />
                </div>
                <div style={{ display: 'flex', justifyContent: 'space-between', marginTop: 6, fontSize: 11.5, color: 'var(--text-muted)' }}>
                  <span>Revenue {inr(c.revenue)}</span>
                  <span>Expense {inr(c.totalExpense + c.vendorPayout)}</span>
                </div>
              </div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

/* ---------------------------------- Vendor form (add/edit, from Settings) ---------------------------------- */

function VendorForm({ initial, employees, onSave, onClose }) {
  const [form, setForm] = useState(initial);
  const [employeeSearch, setEmployeeSearch] = useState('');
  const set = (k, v) => setForm((f) => ({ ...f, [k]: v }));
  const isEdit = !!initial.id;

  const toggleEmployee = (id) => setForm((f) => {
    const has = f.employeeIds.includes(id);
    return { ...f, employeeIds: has ? f.employeeIds.filter((x) => x !== id) : [...f.employeeIds, id] };
  });

  const filteredEmployees = employees.filter((e) => e.name.toLowerCase().includes(employeeSearch.trim().toLowerCase()));

  return (
    <Modal title={isEdit ? 'Edit vendor' : 'Add vendor'} onClose={onClose} width={480}>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
        <div><label className="edm-label">Vendor name</label><input className="edm-input" value={form.name} onChange={(e) => set('name', e.target.value)} placeholder="e.g. Sri Logistics" /></div>
        <div>
          <label className="edm-label">Rate per product delivered (₹)</label>
          <input type="number" min="0" className="edm-input" value={form.amount} onChange={(e) => set('amount', e.target.value)} placeholder="e.g. 5" />
          <p style={{ fontSize: 11.5, color: 'var(--text-muted)', margin: '4px 0 0' }}>The amount payable to this vendor is calculated automatically: this rate × products delivered by their employees, for whatever date range is selected on their tab.</p>
        </div>

        <div>
          <label className="edm-label">Employees under this vendor ({form.employeeIds.length} selected)</label>
          <input className="edm-input" style={{ marginBottom: 8 }} placeholder="Search employees…" value={employeeSearch} onChange={(e) => setEmployeeSearch(e.target.value)} />
          <div className="edm-scroll" style={{ maxHeight: 220, overflowY: 'auto', border: '1px solid var(--border)', borderRadius: 8, padding: 4 }}>
            {filteredEmployees.length === 0 && (
              <div style={{ padding: 12, textAlign: 'center', fontSize: 12.5, color: 'var(--text-muted)' }}>No employees match.</div>
            )}
            {filteredEmployees.map((e) => (
              <label key={e.id} style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '6px 8px', borderRadius: 6, cursor: 'pointer', fontSize: 13 }}>
                <input type="checkbox" checked={form.employeeIds.includes(e.id)} onChange={() => toggleEmployee(e.id)} />
                <span style={{ flex: 1 }}>{e.name}</span>
                <span style={{ fontSize: 11.5, color: 'var(--text-muted)' }}>{e.company}{e.status === 'Inactive' ? ' · inactive' : ''}</span>
              </label>
            ))}
          </div>
        </div>

        <div style={{ display: 'flex', gap: 10, marginTop: 8 }}>
          <button
            className="edm-btn edm-btn-amber"
            style={{ flex: 1, justifyContent: 'center' }}
            onClick={() => form.name.trim() && onSave({ ...form, name: form.name.trim(), amount: Number(form.amount) || 0 })}
          >
            {isEdit ? 'Save changes' : 'Add vendor'}
          </button>
          <button className="edm-btn edm-btn-ghost" onClick={onClose}>Cancel</button>
        </div>
      </div>
    </Modal>
  );
}

/* ---------------------------------- Settings page ---------------------------------- */

function SettingsPage({ rates, setRates, employees = [], entries = [], companies, setCompanies, hubLocations = [], setHubLocations, vendors = [], setVendors, setEmployees, setEntries, lastExportAt, onDataExported, onDataImported }) {
  const [form, setForm] = useState(rates);
  const [saved, setSaved] = useState(false);
  const [removeId, setRemoveId] = useState(null);
  const [newCompanyName, setNewCompanyName] = useState('');
  const [newCompanyRate, setNewCompanyRate] = useState(20);
  const [companyError, setCompanyError] = useState('');
  const [removeCompany, setRemoveCompany] = useState(null);
  const [newHubLocationName, setNewHubLocationName] = useState('');
  const [hubLocationError, setHubLocationError] = useState('');
  const [removeHubLocation, setRemoveHubLocation] = useState(null);
  const [vendorModal, setVendorModal] = useState(null);
  const [removeVendorTarget, setRemoveVendorTarget] = useState(null);
  const [importError, setImportError] = useState('');
  const [importSuccess, setImportSuccess] = useState('');
  const [pendingImport, setPendingImport] = useState(null); // parsed data awaiting confirmation
  const fileInputRef = useRef(null);

  const save = () => { setRates(form); setSaved(true); setTimeout(() => setSaved(false), 1800); };

  const exportAllData = () => {
    const payload = buildBackupPayload({ companies, employees, entries, rates, hubLocations, vendors });
    downloadJson(`deliveryops_backup_${toISO(today())}.json`, payload);
    onDataExported && onDataExported();
  };

  const onFilePicked = (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = ''; // allow re-selecting the same file later
    if (!file) return;
    setImportError('');
    setImportSuccess('');
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        const err = validateBackupPayload(data);
        if (err) { setImportError(err); return; }
        setPendingImport(data);
      } catch (e) {
        setImportError('Could not read this file — make sure it is an exported backup JSON file.');
      }
    };
    reader.onerror = () => setImportError('Could not read this file.');
    reader.readAsText(file);
  };

  const confirmImport = () => {
    if (!pendingImport) return;
    setCompanies(pendingImport.companies);
    setEmployees(pendingImport.employees);
    setEntries(pendingImport.entries);
    setRates(pendingImport.rates);
    setForm(pendingImport.rates);
    setHubLocations(Array.isArray(pendingImport.hubLocations) ? pendingImport.hubLocations : []);
    setVendors(Array.isArray(pendingImport.vendors) ? pendingImport.vendors : []);
    setPendingImport(null);
    setImportSuccess(`Import complete — restored ${pendingImport.employees.length} employees and ${pendingImport.entries.length} entries.`);
    onDataImported && onDataImported();
  };

  const updateStructure = (id, patch) => {
    setForm((f) => ({ ...f, salaryStructures: f.salaryStructures.map((s) => (s.id === id ? { ...s, ...patch } : s)) }));
  };

  const addStructure = () => {
    const n = form.salaryStructures.length + 1;
    setForm((f) => ({
      ...f,
      salaryStructures: [...f.salaryStructures, { id: `structure_${uid()}`, label: `Method ${n}`, perDelivery: 0, petrol: 0 }],
    }));
  };

  const usageCount = (id) => employees.filter((e) => e.salaryMethod === id).length;
  const companyUsageCount = (name) => employees.filter((e) => e.company === name).length;

  const confirmRemove = (id) => {
    setForm((f) => ({ ...f, salaryStructures: f.salaryStructures.filter((s) => s.id !== id) }));
    setRemoveId(null);
  };

  const addCompany = () => {
    const name = newCompanyName.trim();
    if (!name) { setCompanyError('Enter a company name.'); return; }
    if (companies.some((c) => c.toLowerCase() === name.toLowerCase())) { setCompanyError('That company already exists.'); return; }
    setCompanies((prev) => [...prev, name]);
    setForm((f) => ({ ...f, revenue: { ...f.revenue, [name]: Number(newCompanyRate) || 0 } }));
    setNewCompanyName('');
    setNewCompanyRate(20);
    setCompanyError('');
  };

  const confirmRemoveCompany = (name) => {
    setCompanies((prev) => prev.filter((c) => c !== name));
    setForm((f) => {
      const revenue = { ...f.revenue };
      delete revenue[name];
      return { ...f, revenue };
    });
    setRemoveCompany(null);
  };

  const hubLocationUsageCount = (name) => employees.filter((e) => e.hubLocation === name).length;

  const addHubLocation = () => {
    const name = newHubLocationName.trim();
    if (!name) { setHubLocationError('Enter a hub location name.'); return; }
    if (hubLocations.some((h) => h.toLowerCase() === name.toLowerCase())) { setHubLocationError('That hub location already exists.'); return; }
    setHubLocations((prev) => [...prev, name]);
    setNewHubLocationName('');
    setHubLocationError('');
  };

  const confirmRemoveHubLocation = (name) => {
    setHubLocations((prev) => prev.filter((h) => h !== name));
    setRemoveHubLocation(null);
  };

  const addVendor = (form) => {
    setVendors((prev) => [...prev, { ...form, id: `vendor_${uid()}` }]);
    setVendorModal(null);
  };
  const updateVendor = (form) => {
    setVendors((prev) => prev.map((v) => (v.id === form.id ? form : v)));
    setVendorModal(null);
  };
  const confirmRemoveVendor = (id) => {
    setVendors((prev) => prev.filter((v) => v.id !== id));
    setRemoveVendorTarget(null);
  };

  return (
    <div>
      <SectionHeader
        title="Settings"
        subtitle="Salary and revenue rates used across every automatic calculation"
        right={<button className="edm-btn edm-btn-amber" onClick={addStructure}><Plus size={15} /> Add salary structure</button>}
      />

      <div className="edm-card" style={{ padding: 20, marginBottom: 16, borderLeft: '4px solid var(--amber)' }}>
        <h3 className="font-display" style={{ fontSize: 15, fontWeight: 700, margin: '0 0 6px' }}>Data &amp; backup</h3>
        <p style={{ fontSize: 12.5, color: 'var(--text-muted)', margin: '0 0 14px' }}>
          Everything — employees, daily entries, rates, and companies — lives only in this browser. Export a backup regularly, and keep the file somewhere safe (email it to yourself, or save it to cloud storage).
        </p>
        <div style={{ display: 'flex', flexWrap: 'wrap', gap: 10, alignItems: 'center' }}>
          <button className="edm-btn edm-btn-amber" onClick={exportAllData}><Download size={15} /> Export all data (JSON)</button>
          <button className="edm-btn edm-btn-ghost" onClick={() => fileInputRef.current && fileInputRef.current.click()}><Upload size={15} /> Import backup</button>
          <input ref={fileInputRef} type="file" accept="application/json,.json" style={{ display: 'none' }} onChange={onFilePicked} />
          <span style={{ fontSize: 12, color: 'var(--text-muted)' }}>
            {lastExportAt ? `Last export: ${new Date(lastExportAt).toLocaleString('en-IN')}` : 'No export yet — export a backup now.'}
          </span>
        </div>
        {importError && <p style={{ fontSize: 12.5, color: 'var(--danger)', marginTop: 10, marginBottom: 0 }}>{importError}</p>}
        {importSuccess && <p style={{ fontSize: 12.5, color: 'var(--teal-dark)', marginTop: 10, marginBottom: 0 }}>{importSuccess}</p>}
      </div>

      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(260px, 1fr))', gap: 16, marginBottom: 16 }}>
        {form.salaryStructures.map((s) => {
          const inUse = usageCount(s.id);
          return (
            <div key={s.id} className="edm-card" style={{ padding: 20, position: 'relative' }}>
              <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 14, gap: 8 }}>
                <input
                  className="edm-input font-display"
                  style={{ fontWeight: 700, fontSize: 15, border: 'none', padding: '2px 0', background: 'transparent' }}
                  value={s.label}
                  onChange={(e) => updateStructure(s.id, { label: e.target.value })}
                />
                <button
                  className="edm-btn edm-btn-danger-ghost"
                  style={{ padding: 6, flexShrink: 0 }}
                  disabled={form.salaryStructures.length <= 1}
                  title={form.salaryStructures.length <= 1 ? "At least one salary structure is required" : "Remove this structure"}
                  onClick={() => setRemoveId(s.id)}
                >
                  <Trash2 size={13} />
                </button>
              </div>
              <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
                <div>
                  <label className="edm-label">Rate per successful delivery (₹)</label>
                  <input type="number" className="edm-input" value={s.perDelivery} onChange={(e) => updateStructure(s.id, { perDelivery: Number(e.target.value) })} />
                </div>
                <div>
                  <label className="edm-label">Petrol / other allowance per working day (₹)</label>
                  <input type="number" className="edm-input" value={s.petrol} onChange={(e) => updateStructure(s.id, { petrol: Number(e.target.value) })} />
                </div>
              </div>
              {inUse > 0 && (
                <p style={{ fontSize: 12, color: 'var(--text-muted)', marginTop: 10, marginBottom: 0 }}>
                  Used by {inUse} employee{inUse === 1 ? '' : 's'}
                </p>
              )}
            </div>
          );
        })}
      </div>

      <div className="edm-card" style={{ padding: 20, marginBottom: 16 }}>
        <h3 className="font-display" style={{ fontSize: 15, fontWeight: 700, margin: '0 0 14px' }}>Companies &amp; revenue rates</h3>
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 16, marginBottom: 18 }}>
          {companies.map((c) => {
            const inUse = companyUsageCount(c);
            return (
              <div key={c} className="edm-card" style={{ padding: 14 }}>
                <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 8, marginBottom: 8 }}>
                  <label className="edm-label" style={{ marginBottom: 0 }}>{c}</label>
                  <button
                    className="edm-btn edm-btn-danger-ghost"
                    style={{ padding: 5, flexShrink: 0 }}
                    disabled={companies.length <= 1}
                    title={companies.length <= 1 ? "At least one company is required" : "Remove this company"}
                    onClick={() => setRemoveCompany(c)}
                  >
                    <Trash2 size={12} />
                  </button>
                </div>
                <label className="edm-label">₹ per successful delivery</label>
                <input type="number" className="edm-input" value={form.revenue[c] ?? 0} onChange={(e) => setForm((f) => ({ ...f, revenue: { ...f.revenue, [c]: Number(e.target.value) } }))} />
                {inUse > 0 && (
                  <p style={{ fontSize: 12, color: 'var(--text-muted)', marginTop: 8, marginBottom: 0 }}>
                    {inUse} employee{inUse === 1 ? '' : 's'} assigned
                  </p>
                )}
              </div>
            );
          })}
        </div>

        <div style={{ borderTop: '1px solid var(--border)', paddingTop: 16 }}>
          <label className="edm-label">Add a new company</label>
          <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap', alignItems: 'flex-end' }}>
            <div style={{ flex: 2, minWidth: 180 }}>
              <input className="edm-input" placeholder="Company name" value={newCompanyName} onChange={(e) => { setNewCompanyName(e.target.value); setCompanyError(''); }} />
            </div>
            <div style={{ flex: 1, minWidth: 140 }}>
              <input type="number" className="edm-input" placeholder="₹ per delivery" value={newCompanyRate} onChange={(e) => setNewCompanyRate(e.target.value)} />
            </div>
            <button className="edm-btn edm-btn-amber" onClick={addCompany}><Plus size={15} /> Add company</button>
          </div>
          {companyError && <p style={{ fontSize: 12, color: 'var(--danger)', marginTop: 8, marginBottom: 0 }}>{companyError}</p>}
          <p style={{ fontSize: 12, color: 'var(--text-muted)', marginTop: 8, marginBottom: 0 }}>
            A new revenue link for this company appears in the sidebar under "Money" once added, and its revenue trend builds automatically as you log daily deliveries for it.
          </p>
        </div>
      </div>

      <div className="edm-card" style={{ padding: 20, marginBottom: 16 }}>
        <h3 className="font-display" style={{ fontSize: 15, fontWeight: 700, margin: '0 0 6px' }}>Hub locations</h3>
        <p style={{ fontSize: 12.5, color: 'var(--text-muted)', margin: '0 0 14px' }}>
          Add every hub as its own entry here — they'll show up as a dropdown when assigning an employee's hub location in Employee management.
        </p>

        {hubLocations.length > 0 && (
          <div style={{ display: 'flex', flexWrap: 'wrap', gap: 8, marginBottom: 16 }}>
            {hubLocations.map((h) => {
              const inUse = hubLocationUsageCount(h);
              return (
                <div key={h} className="edm-card" style={{ padding: '7px 8px 7px 12px', display: 'flex', alignItems: 'center', gap: 8 }}>
                  <span style={{ fontSize: 13 }}>{h}</span>
                  {inUse > 0 && (
                    <span style={{ fontSize: 11, color: 'var(--text-muted)' }}>({inUse})</span>
                  )}
                  <button
                    className="edm-btn edm-btn-danger-ghost"
                    style={{ padding: 4 }}
                    title="Remove this hub location"
                    onClick={() => setRemoveHubLocation(h)}
                  >
                    <Trash2 size={11} />
                  </button>
                </div>
              );
            })}
          </div>
        )}

        <div style={{ borderTop: hubLocations.length > 0 ? '1px solid var(--border)' : 'none', paddingTop: hubLocations.length > 0 ? 16 : 0 }}>
          <label className="edm-label">Add a new hub location</label>
          <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap', alignItems: 'flex-end' }}>
            <div style={{ flex: 1, minWidth: 180 }}>
              <input
                className="edm-input" placeholder="e.g. Whitefield hub"
                value={newHubLocationName}
                onChange={(e) => { setNewHubLocationName(e.target.value); setHubLocationError(''); }}
                onKeyDown={(e) => { if (e.key === 'Enter') { e.preventDefault(); addHubLocation(); } }}
              />
            </div>
            <button className="edm-btn edm-btn-amber" onClick={addHubLocation}><Plus size={15} /> Add hub location</button>
          </div>
          {hubLocationError && <p style={{ fontSize: 12, color: 'var(--danger)', marginTop: 8, marginBottom: 0 }}>{hubLocationError}</p>}
        </div>
      </div>

      <div className="edm-card" style={{ padding: 20, marginBottom: 16 }}>
        <div style={{ display: 'flex', alignItems: 'flex-start', justifyContent: 'space-between', gap: 12, marginBottom: 6, flexWrap: 'wrap' }}>
          <h3 className="font-display" style={{ fontSize: 15, fontWeight: 700, margin: 0 }}>Vendors</h3>
          <button className="edm-btn edm-btn-amber" onClick={() => setVendorModal({ mode: 'add' })}><Plus size={15} /> Add vendor</button>
        </div>
        <p style={{ fontSize: 12.5, color: 'var(--text-muted)', margin: '0 0 14px' }}>
          Each vendor you add here gets its own tab in the sidebar under "Vendors" — showing the amount payable to them and the employees you assign. Add as many as you need; removing one removes its tab too.
        </p>

        {vendors.length === 0 ? (
          <p style={{ fontSize: 13, color: 'var(--text-muted)', margin: 0 }}>No vendors added yet.</p>
        ) : (
          <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
            {vendors.map((v) => {
              const empCount = (v.employeeIds || []).length;
              return (
                <div key={v.id} className="edm-card" style={{ padding: 14, display: 'flex', alignItems: 'center', gap: 14, flexWrap: 'wrap' }}>
                  <div style={{ flex: 1, minWidth: 140 }}>
                    <div style={{ fontWeight: 700, fontSize: 13.5 }}>{v.name}</div>
                    <div style={{ fontSize: 12, color: 'var(--text-muted)' }}>{empCount} employee{empCount === 1 ? '' : 's'} assigned</div>
                  </div>
                  <div className="font-mono" style={{ fontWeight: 700, fontSize: 14 }}>{inr(v.amount)}<span style={{ fontWeight: 400, fontSize: 11.5, color: 'var(--text-muted)' }}> /delivery</span></div>
                  <div style={{ display: 'flex', gap: 6 }}>
                    <button className="edm-btn edm-btn-ghost" style={{ padding: 6 }} onClick={() => setVendorModal({ mode: 'edit', vendor: v })}><Pencil size={13} /></button>
                    <button className="edm-btn edm-btn-danger-ghost" style={{ padding: 6 }} onClick={() => setRemoveVendorTarget(v)}><Trash2 size={13} /></button>
                  </div>
                </div>
              );
            })}
          </div>
        )}
      </div>

      <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
        <button className="edm-btn edm-btn-amber" onClick={save}>Save settings</button>
        {saved && <span style={{ fontSize: 13, color: 'var(--teal-dark)', fontWeight: 600 }}>Settings saved</span>}
      </div>

      {removeId && (
        <Modal title="Remove salary structure" onClose={() => setRemoveId(null)} width={380}>
          <p style={{ fontSize: 13.5, color: 'var(--text-muted)', margin: '0 0 16px' }}>
            {usageCount(removeId) > 0
              ? `${usageCount(removeId)} employee${usageCount(removeId) === 1 ? ' is' : 's are'} currently assigned to this structure. Their payroll will fall back to the first remaining structure until reassigned. This can't be undone.`
              : "This removes the salary structure. This can't be undone."}
          </p>
          <div style={{ display: 'flex', gap: 10 }}>
            <button className="edm-btn" style={{ flex: 1, justifyContent: 'center', background: 'var(--danger)', color: '#fff' }} onClick={() => confirmRemove(removeId)}>Remove</button>
            <button className="edm-btn edm-btn-ghost" onClick={() => setRemoveId(null)}>Cancel</button>
          </div>
        </Modal>
      )}
      {removeCompany && (

            <button className="edm-btn" style={{ flex: 1, justifyContent: 'center', background: 'var(--danger)', color: '#fff' }} onClick={confirmImport}>Replace all data</button>
            <button className="edm-btn edm-btn-ghost" onClick={() => setPendingImport(null)}>Cancel</button>
          </div>
        </Modal>

    </div>
  );
}

/* ------------------------------ Local persistence ------------------------------ */
const LS_PREFIX = 'edm_';
function loadLS(key, fallback) {
  try {
    const raw = window.localStorage.getItem(LS_PREFIX + key);
    if (raw === null || raw === undefined) return fallback;
    return JSON.parse(raw);
  } catch (e) {
    console.error('Failed to load saved data for', key, e);
    return fallback;
  }
}
function saveLS(key, value) {
  try {
    window.localStorage.setItem(LS_PREFIX + key, JSON.stringify(value));
  } catch (e) {
    console.error('Failed to save data for', key, e);
  }
}

/* ================================================================
   Firebase — init, auth, and Firestore sync
   ----------------------------------------------------------------
   This connects the dashboard to a real cloud database (Firestore)
   so that data entered on one device shows up on every other
   device/browser signed in to the same project. Login now goes
   through Firebase Authentication (Email/Password) instead of a
   locally-stored password hash — the actual users and passwords
   live in the Firebase console, not in this file.

   Note: the config below (apiKey, projectId, etc.) is meant to be
   public — it's not a secret. Real protection comes from the
   Firestore Security Rules (set in the Firebase console) and from
   only the email addresses you've explicitly created being allowed
   to sign in / read-write data.
   ================================================================ */

const firebaseConfig = {
  apiKey: "AIzaSyDebQVcVYL50g3fDxBJekCuSuxvCQcui2s",
  authDomain: "chridelivery.firebaseapp.com",
  projectId: "chridelivery",
  storageBucket: "chridelivery.firebasestorage.app",
  messagingSenderId: "1024014445318",
  appId: "1:1024014445318:web:aec3551b4c6c5aaa138c87"
};
firebase.initializeApp(firebaseConfig);
const fbAuth = firebase.auth();
const db = firebase.firestore();
db.enablePersistence({ synchronizeTabs: true }).catch(() => {});

// Firebase Auth needs an email address. Usernames typed at login are
// mapped to a fake-but-valid email under this fixed domain, so users
// only ever see/type a plain "username".
const AUTH_EMAIL_DOMAIN = 'chridelivery.local';
const usernameToEmail = (u) => {
  const v = u.trim().toLowerCase();
  return v.includes('@') ? v : `${v}@${AUTH_EMAIL_DOMAIN}`;
};
const emailToUsername = (e) => (e || '').split('@')[0];
const displayNameFromUsername = (u) => (u ? u.charAt(0).toUpperCase() + u.slice(1) : '');

// The single Firestore document that stores all shared business data.
const DATA_DOC = db.collection('deliveryops').doc('main');

function LoginPage({ onLogin }) {
  const [username, setUsername] = useState('');
  const [password, setPassword] = useState('');
  const [showPw, setShowPw] = useState(false);
  const [error, setError] = useState('');
  const [busy, setBusy] = useState(false);

  const submit = async (e) => {
    e.preventDefault();
    setError('');
    if (!username.trim() || !password) { setError('Enter both username and password.'); return; }
    setBusy(true);
    try {
      await fbAuth.signInWithEmailAndPassword(usernameToEmail(username), password);
      // onAuthStateChanged (in App) picks up the signed-in user from here.
    } catch (err) {
      if (err && (err.code === 'auth/user-not-found' || err.code === 'auth/wrong-password' || err.code === 'auth/invalid-credential' || err.code === 'auth/invalid-email')) {
        setError('Incorrect username or password.');
      } else if (err && err.code === 'auth/too-many-requests') {
        setError('Too many attempts. Please wait a moment and try again.');
      } else if (err && err.code === 'auth/network-request-failed') {
        setError('Network error — check your connection and try again.');
      } else {
        setError('Login failed. Please try again.');
      }
    } finally {
      setBusy(false);
    }
  };

  return (
    <div className="edm-root" style={{ minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', background: 'var(--navy)', padding: 16 }}>
      <GlobalStyle />
      <form onSubmit={submit} className="edm-card" style={{ width: '100%', maxWidth: 360, padding: 28, background: '#fff' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 22 }}>
          <div style={{ width: 38, height: 38, borderRadius: 9, background: 'var(--amber)', display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>
            <Truck size={20} color="#2A1B05" />
          </div>
          <div>
            <div className="font-display" style={{ fontWeight: 700, fontSize: 16 }}>CHRI AGENCY</div>
            <div style={{ color: 'var(--text-muted)', fontSize: 11.5 }}>Sign in to continue</div>
          </div>
        </div>

        <label className="edm-label">Username</label>
        <input
          className="edm-input" style={{ marginBottom: 14 }}
          value={username} onChange={(e) => setUsername(e.target.value)}
          autoFocus autoComplete="username" placeholder="Username or email"
        />

        <label className="edm-label">Password</label>
        <div style={{ position: 'relative', marginBottom: 16 }}>
          <input
            className="edm-input" style={{ paddingRight: 38 }}
            type={showPw ? 'text' : 'password'}
            value={password} onChange={(e) => setPassword(e.target.value)}
            autoComplete="current-password" placeholder="Enter your password"
          />
          <button type="button" onClick={() => setShowPw((s) => !s)}
            style={{ position: 'absolute', right: 8, top: '50%', transform: 'translateY(-50%)', background: 'transparent', border: 'none', cursor: 'pointer', color: 'var(--text-muted)', padding: 4, display: 'flex' }}>
            {showPw ? <EyeOff size={16} /> : <Eye size={16} />}
          </button>
        </div>

        {error && (
          <div style={{ display: 'flex', alignItems: 'center', gap: 8, background: '#FBEAEA', border: '1px solid #F3C6C6', color: '#B23A3A', borderRadius: 8, padding: '8px 10px', fontSize: 12.5, marginBottom: 14 }}>
            <AlertTriangle size={14} style={{ flexShrink: 0 }} /> {error}
          </div>
        )}

        <button type="submit" disabled={busy} className="edm-btn edm-btn-amber" style={{ width: '100%', justifyContent: 'center', padding: '10px 14px', opacity: busy ? 0.7 : 1 }}>
          <Lock size={14} /> {busy ? 'Signing in…' : 'Sign in'}
        </button>

        <div style={{ marginTop: 16, fontSize: 11, color: 'var(--text-muted)', lineHeight: 1.5, display: 'flex', gap: 6 }}>
          <Lock size={12} style={{ flexShrink: 0, marginTop: 2 }} />
          <span>Access is restricted to authorized users. Your data syncs live across every device you sign in on.</span>
        </div>
      </form>
    </div>
  );
}

function App() {
  const [authState, setAuthState] = useState('loading'); // 'loading' | 'signedOut' | 'signedIn'
  const [currentUser, setCurrentUser] = useState(null);

  useEffect(() => {
    const unsub = fbAuth.onAuthStateChanged((user) => {
      if (user) {
        const username = emailToUsername(user.email);
        setCurrentUser({ username, name: displayNameFromUsername(username) });
        setAuthState('signedIn');
      } else {
        setCurrentUser(null);
        setAuthState('signedOut');
      }
    });
    return () => unsub();
  }, []);

  const handleLogout = () => { fbAuth.signOut(); };

  if (authState === 'loading') {
    return (
      <div className="edm-root" style={{ minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', background: 'var(--navy)', color: '#B7C0D8', fontSize: 13.5 }}>
        <GlobalStyle />
        Loading…
      </div>
    );
  }
  if (authState === 'signedOut' || !currentUser) {
    return <LoginPage onLogin={() => {}} />;
  }
  return <DashboardApp currentUser={currentUser} onLogout={handleLogout} />;
}

function DashboardApp({ currentUser, onLogout }) {
  const [companies, setCompanies] = useState(() => loadLS('companies', DEFAULT_COMPANIES));
  const [hubLocations, setHubLocations] = useState(() => loadLS('hubLocations', DEFAULT_HUB_LOCATIONS));
  const [vendors, setVendors] = useState(() => loadLS('vendors', []));
  const [employees, setEmployees] = useState(() => loadLS('employees', []));
  const [entries, setEntries] = useState(() => loadLS('entries', []));
  const [rates, setRates] = useState(() => loadLS('rates', DEFAULT_RATES));
  const [page, setPage] = useState(() => loadLS('page', 'dashboard'));
  const [lastExportAt, setLastExportAt] = useState(() => loadLS('lastExportAt', null));
  const [reminderSnoozedAt, setReminderSnoozedAt] = useState(() => loadLS('reminderSnoozedAt', null));
  const [syncStatus, setSyncStatus] = useState('connecting'); // connecting | synced | syncing | offline | error

  const applyingRemoteRef = useRef(false);
  const hasLoadedRemoteRef = useRef(false);

  // Subscribe to the shared Firestore document — this is what makes changes
  // made on one device show up on every other signed-in device.
  useEffect(() => {
    const unsub = DATA_DOC.onSnapshot(
      (snap) => {
        if (snap.exists) {
          const data = snap.data() || {};
          applyingRemoteRef.current = true;
          if (Array.isArray(data.companies)) setCompanies(data.companies);
          if (Array.isArray(data.hubLocations)) setHubLocations(data.hubLocations);
          if (Array.isArray(data.vendors)) setVendors(data.vendors);
          if (Array.isArray(data.employees)) setEmployees(data.employees);
          if (Array.isArray(data.entries)) setEntries(data.entries);
          if (data.rates) setRates(data.rates);
          hasLoadedRemoteRef.current = true;
          setSyncStatus(snap.metadata.fromCache ? 'offline' : 'synced');
        } else if (!hasLoadedRemoteRef.current) {
          // Nothing in Firestore yet — seed it with whatever's already in this browser.
          hasLoadedRemoteRef.current = true;
          DATA_DOC.set({ companies, hubLocations, vendors, employees, entries, rates, updatedAt: firebase.firestore.FieldValue.serverTimestamp() }).catch(() => setSyncStatus('error'));
        }
      },
      () => setSyncStatus('error')
    );
    return () => unsub();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  // Push local changes up to Firestore (debounced), but skip the write that
  // would just be echoing back data we *received* from a remote snapshot.
  useEffect(() => {
    if (!hasLoadedRemoteRef.current) return;
    if (applyingRemoteRef.current) { applyingRemoteRef.current = false; return; }
    setSyncStatus('syncing');
    const t = setTimeout(() => {
      DATA_DOC.set({ companies, hubLocations, vendors, employees, entries, rates, updatedAt: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true })
        .then(() => setSyncStatus('synced'))
        .catch(() => setSyncStatus('error'));
    }, 600);
    return () => clearTimeout(t);
  }, [companies, hubLocations, vendors, employees, entries, rates]);

  // Keep a local cache too, so the dashboard opens instantly and still works
  // briefly offline (Firestore's own offline cache also helps with this).
  useEffect(() => { saveLS('companies', companies); }, [companies]);
  useEffect(() => { saveLS('hubLocations', hubLocations); }, [hubLocations]);
  useEffect(() => { saveLS('vendors', vendors); }, [vendors]);
  useEffect(() => { saveLS('employees', employees); }, [employees]);
  useEffect(() => { saveLS('entries', entries); }, [entries]);
  useEffect(() => { saveLS('rates', rates); }, [rates]);
  useEffect(() => { saveLS('page', page); }, [page]);
  useEffect(() => { saveLS('lastExportAt', lastExportAt); }, [lastExportAt]);
  useEffect(() => { saveLS('reminderSnoozedAt', reminderSnoozedAt); }, [reminderSnoozedAt]);

  const daysSince = (iso) => (iso ? (Date.now() - new Date(iso).getTime()) / 86400000 : Infinity);
  const showBackupReminder = employees.length > 0 && daysSince(lastExportAt) >= 7 && daysSince(reminderSnoozedAt) >= 3;
  const exportFromReminder = () => {
    const payload = buildBackupPayload({ companies, employees, entries, rates, hubLocations, vendors });
    downloadJson(`deliveryops_backup_${toISO(today())}.json`, payload);
    setLastExportAt(new Date().toISOString());
  };

  const empById = useMemo(() => Object.fromEntries(employees.map((e) => [e.id, e])), [employees]);
  const nav = useMemo(() => buildNav(companies, vendors), [companies, vendors]);
  const [mobileNavOpen, setMobileNavOpen] = useState(false);
  const currentNavLabel = useMemo(() => {
    for (const g of nav) { const found = g.items.find((i) => i.id === page); if (found) return found.label; }
    return 'CHRI AGENCY';
  }, [nav, page]);

  const renderPage = () => {
    if (page.startsWith('revenue:')) {
      const company = page.slice('revenue:'.length);
      if (!companies.includes(company)) return <DashboardPage employees={employees} entries={entries} empById={empById} rates={rates} vendors={vendors} />;
      return <RevenuePage company={company} employees={employees} entries={entries} empById={empById} rates={rates} />;
    }
    if (page.startsWith('vendor:')) {
      const vendorId = page.slice('vendor:'.length);
      const vendor = vendors.find((v) => v.id === vendorId);
      if (!vendor) return <DashboardPage employees={employees} entries={entries} empById={empById} rates={rates} vendors={vendors} />;
      return <VendorPage vendor={vendor} employees={employees} entries={entries} empById={empById} rates={rates} onManage={() => setPage('settings')} />;
    }
    switch (page) {
      case 'dashboard': return <DashboardPage employees={employees} entries={entries} empById={empById} rates={rates} vendors={vendors} />;
      case 'employees': return <EmployeesPage employees={employees} setEmployees={setEmployees} empById={empById} entries={entries} rates={rates} />;
      case 'inactiveEmployees': return <InactiveEmployeesPage employees={employees} setEmployees={setEmployees} empById={empById} rates={rates} />;
      case 'dailyEntry': return <DailyEntryPage employees={employees} entries={entries} setEntries={setEntries} empById={empById} rates={rates} />;
      case 'salary': return <SalaryPage employees={employees} entries={entries} rates={rates} />;
      case 'reportDaily': return <ReportPage level="daily" employees={employees} entries={entries} empById={empById} rates={rates} vendors={vendors} />;
      case 'reportWeekly': return <ReportPage level="weekly" employees={employees} entries={entries} empById={empById} rates={rates} vendors={vendors} />;
      case 'reportMonthly': return <ReportPage level="monthly" employees={employees} entries={entries} empById={empById} rates={rates} vendors={vendors} />;
      case 'reportYearly': return <ReportPage level="yearly" employees={employees} entries={entries} empById={empById} rates={rates} vendors={vendors} />;
      case 'pnl': return <PnLPage employees={employees} entries={entries} empById={empById} rates={rates} vendors={vendors} />;
      case 'settings': return (
        <SettingsPage
          rates={rates} setRates={setRates}
          employees={employees} setEmployees={setEmployees}
          entries={entries} setEntries={setEntries}
          companies={companies} setCompanies={setCompanies}
          hubLocations={hubLocations} setHubLocations={setHubLocations}
          vendors={vendors} setVendors={setVendors}
          lastExportAt={lastExportAt}
          onDataExported={() => setLastExportAt(new Date().toISOString())}
          onDataImported={() => setPage('dashboard')}
        />
      );
      default: return null;
    }
  };

  const goTo = (id) => { setPage(id); setMobileNavOpen(false); };

  return (
    <CompaniesContext.Provider value={companies}>
    <HubLocationsContext.Provider value={hubLocations}>
    <div className="edm-root" style={{ display: 'flex', minHeight: '100vh', fontSize: 14 }}>
      <GlobalStyle />

      <div className={`edm-sidebar-backdrop ${mobileNavOpen ? 'edm-open' : ''}`} onClick={() => setMobileNavOpen(false)} />

      <aside className={mobileNavOpen ? 'edm-sidebar-open' : ''} style={{ width: 248, flexShrink: 0, background: 'var(--navy)', padding: '20px 14px', display: 'flex', flexDirection: 'column', gap: 4 }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 9, padding: '4px 10px 20px' }}>
          <div style={{ width: 30, height: 30, borderRadius: 8, background: 'var(--amber)', display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>
            <Truck size={16} color="#2A1B05" />
          </div>
          <div style={{ flex: 1 }}>
            <div className="font-display" style={{ color: '#fff', fontWeight: 700, fontSize: 14, lineHeight: 1.2 }}>CHRI AGENCY</div>
            <div style={{ color: '#7C88A6', fontSize: 10.5 }}>Delivery management</div>
          </div>
          <button className="edm-menu-btn" onClick={() => setMobileNavOpen(false)} style={{ background: 'transparent', border: 'none', color: '#B7C0D8', cursor: 'pointer', padding: 4 }}>
            <X size={18} />
          </button>
        </div>

        <div className="edm-scroll" style={{ overflowY: 'auto', flex: 1 }}>
          {nav.filter((group) => group.items.length > 0).map((group) => (
            <div key={group.section} style={{ marginBottom: 14 }}>
              <div style={{ color: '#5D6A8C', fontSize: 10.5, fontWeight: 700, textTransform: 'uppercase', letterSpacing: '.06em', padding: '4px 10px 6px' }}>{group.section}</div>
              {group.items.map((item) => (
                <div key={item.id} className={`edm-nav-item ${page === item.id ? 'active' : ''}`} onClick={() => goTo(item.id)}>
                  <item.icon size={15} />
                  <span>{item.label}</span>
                </div>
              ))}
            </div>
          ))}
        </div>

        <div style={{ borderTop: '1px solid var(--navy-3)', paddingTop: 10, marginTop: 6 }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 9, padding: '0 10px 8px' }}>
            <div style={{ width: 26, height: 26, borderRadius: '50%', background: 'var(--navy-3)', display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0, color: '#fff', fontSize: 11.5, fontWeight: 700 }}>
              {(currentUser && currentUser.name ? currentUser.name : '?').slice(0, 1).toUpperCase()}

            <Menu size={18} />

          <div className="font-display" style={{ fontWeight: 700, fontSize: 16 }}>{currentNavLabel}</div>

        {showBackupReminder && (

            borderRadius: 10, padding: '12px 16px', marginBottom: 20,
          }}>
            <AlertTriangle size={18} color="#B8720A" style={{ flexShrink: 0 }} />
            <span style={{ fontSize: 13, color: '#7A4A0A', flex: 1 }}>
              {lastExportAt
                ? `It's been over a week since your last backup (${new Date(lastExportAt).toLocaleDateString('en-IN')}). Export your data to keep it safe.`
                : "You haven't exported a backup yet. Your data only lives in this browser — export it to keep it safe."}
            </span>
            <button className="edm-btn edm-btn-amber" style={{ padding: '7px 12px' }} onClick={exportFromReminder}><Download size={14} /> Export now</button>
            <button className="edm-btn edm-btn-ghost" style={{ padding: '7px 12px' }} onClick={() => setReminderSnoozedAt(new Date().toISOString())}>Remind me later</button>
          </div>
        )}
        {renderPage()}
      </main>
    </div>
    </HubLocationsContext.Provider>
    </CompaniesContext.Provider>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
