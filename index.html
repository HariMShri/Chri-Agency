/* ============================================================
   Minimal chart engine (replaces recharts so the file has zero
   external charting-library dependency)
   ============================================================ */
function ResponsiveContainer({ width, height, children }) {
  const ref = useRef(null);
  const [size, setSize] = useState({ w: 0, h: typeof height === 'number' ? height : 300 });
  useEffect(() => {
    if (!ref.current) return;
    const el = ref.current;
    const update = () => setSize({ w: el.clientWidth, h: el.clientHeight || (typeof height === 'number' ? height : 300) });
    update();
    const ro = new ResizeObserver(update);
    ro.observe(el);
    return () => ro.disconnect();
  }, []);
  return (
    <div ref={ref} style={{ width: width || '100%', height: height || '100%' }}>
      {size.w > 0 ? React.cloneElement(React.Children.only(children), { width: size.w, height: size.h }) : null}
    </div>
  );
}

function CartesianGrid() { return null; }
function XAxis() { return null; }
function YAxis() { return null; }
function Tooltip() { return null; }
function Legend() { return null; }
function Bar() { return null; }
function Line() { return null; }

function niceStep(range) {
  const rough = range / 5;
  const mag = Math.pow(10, Math.floor(Math.log10(rough || 1)));
  const norm = rough / mag;
  let step;
  if (norm < 1.5) step = 1; else if (norm < 3) step = 2; else if (norm < 7) step = 5; else step = 10;
  return step * mag;
}

function ComposedChart({ data = [], margin = {}, width, height, children }) {
  const kids = React.Children.toArray(children);
  const bars = kids.filter(c => c.type === Bar);
  const lines = kids.filter(c => c.type === Line);
  const xAxisEl = kids.find(c => c.type === XAxis);
  const legendEl = kids.find(c => c.type === Legend);
  const tooltipEl = kids.find(c => c.type === Tooltip);
  const gridEl = kids.find(c => c.type === CartesianGrid);

  const m = { top: 10, right: 10, bottom: 24, left: 10, ...margin };
  const legendH = legendEl ? 24 : 0;
  const w = Math.max(50, width || 400);
  const h = Math.max(80, height || 260);
  const plotW = Math.max(10, w - m.left - m.right - 36);
  const plotLeft = m.left + 36;
  const plotH = Math.max(10, h - m.top - m.bottom - legendH);

  const xKey = xAxisEl ? xAxisEl.props.dataKey : 'label';
  const labels = data.map(d => d[xKey]);

  const allVals = [];
  bars.forEach(b => data.forEach(d => allVals.push(Number(d[b.props.dataKey]) || 0)));
  lines.forEach(l => data.forEach(d => allVals.push(Number(d[l.props.dataKey]) || 0)));
  let maxVal = allVals.length ? Math.max(...allVals) : 1;
  let minVal = allVals.length ? Math.min(0, ...allVals) : 0;
  if (maxVal === minVal) maxVal = minVal + 1;
  const step = niceStep(maxVal - minVal);
  const niceMax = Math.ceil(maxVal / step) * step;
  const niceMin = Math.floor(minVal / step) * step;
  const span = niceMax - niceMin || 1;

  const yFor = (v) => m.top + plotH - ((v - niceMin) / span) * plotH;
  const n = Math.max(1, data.length);
  const bandW = plotW / n;
  const groupW = bandW * 0.62;
  const barW = bars.length ? Math.min(groupW / bars.length, bars[0].props.maxBarSize || 999) : 0;

  const [hoverIdx, setHoverIdx] = useState(null);
  const gridLines = [];
  for (let v = niceMin; v <= niceMax + 1e-9; v += step) gridLines.push(v);

  const xTickInterval = xAxisEl && xAxisEl.props.interval ? Math.max(1, xAxisEl.props.interval) : 1;

  return (
    <div style={{ position: 'relative', width: w, height: h }}>
      <svg width={w} height={h}>
        {gridEl && gridLines.map((v, i) => (
          <line key={i} x1={plotLeft} x2={plotLeft + plotW} y1={yFor(v)} y2={yFor(v)} stroke="#EEF0F2" />
        ))}
        {gridLines.map((v, i) => (
          <text key={'yl' + i} x={plotLeft - 8} y={yFor(v) + 3} textAnchor="end" fontSize="11" fill="#6B7280">
            {Math.abs(v) >= 1000 ? (v / 1000).toFixed(v % 1000 === 0 ? 0 : 1) + 'k' : v}
          </text>
        ))}
        <line x1={plotLeft} x2={plotLeft} y1={m.top} y2={m.top + plotH} stroke="#E4E6EA" />
        <line x1={plotLeft} x2={plotLeft + plotW} y1={m.top + plotH} y2={m.top + plotH} stroke="#E4E6EA" />

        {labels.map((lab, i) => (
          i % xTickInterval === 0 ? (
            <text key={'xl' + i} x={plotLeft + bandW * i + bandW / 2} y={m.top + plotH + 16}
              textAnchor="middle" fontSize="11" fill="#6B7280">{String(lab).slice(0, 8)}</text>
          ) : null
        ))}

        {bars.map((bar, bi) => data.map((d, i) => {
          const val = Number(d[bar.props.dataKey]) || 0;
          const x = plotLeft + bandW * i + (bandW - groupW) / 2 + bi * barW;
          const yTop = yFor(Math.max(val, 0));
          const yBase = yFor(0);
          const barH = Math.abs(yBase - yTop);
          return (
            <rect key={bi + '-' + i}
              x={x} y={Math.min(yTop, yBase)} width={Math.max(1, barW - 2)} height={Math.max(0, barH)}
              fill={bar.props.fill} rx="2"
              opacity={hoverIdx === i ? 0.85 : 1}
              onMouseEnter={() => setHoverIdx(i)} onMouseLeave={() => setHoverIdx(null)} />
          );
        }))}

        {lines.map((line, li) => {
          const pts = data.map((d, i) => {
            const val = Number(d[line.props.dataKey]) || 0;
            return `${plotLeft + bandW * i + bandW / 2},${yFor(val)}`;
          }).join(' ');
          return <polyline key={li} points={pts} fill="none" stroke={line.props.stroke} strokeWidth={line.props.strokeWidth || 2} />;
        })}

        {data.map((d, i) => (
          <rect key={'hz' + i} x={plotLeft + bandW * i} y={m.top} width={bandW} height={plotH}
            fill="transparent"
            onMouseEnter={() => setHoverIdx(i)} onMouseLeave={() => setHoverIdx(null)} />
        ))}
      </svg>

      {tooltipEl && hoverIdx !== null && data[hoverIdx] && (
        <div style={{
          position: 'absolute', left: Math.min(w - 150, plotLeft + bandW * hoverIdx + bandW), top: m.top,
          background: '#fff', border: '1px solid #E4E6EA', borderRadius: 8, padding: '6px 10px',
          fontSize: 12, color: '#12192B', pointerEvents: 'none', boxShadow: '0 4px 12px rgba(0,0,0,0.08)'
        }}>
          <div style={{ fontWeight: 600, marginBottom: 4 }}>{String(data[hoverIdx][xKey])}</div>
          {[...bars, ...lines].map((s, i) => {
            const val = data[hoverIdx][s.props.dataKey];
            const fmt = tooltipEl.props.formatter ? tooltipEl.props.formatter(val) : val;
            return <div key={i} style={{ color: s.props.fill || s.props.stroke }}>{s.props.name}: {fmt}</div>;
          })}
        </div>
      )}

      {legendEl && (
        <div style={{ display: 'flex', gap: 16, justifyContent: 'center', fontSize: 12, marginTop: 4 }}>
          {[...bars, ...lines].map((s, i) => (
            <div key={i} style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
              <span style={{ width: 10, height: 10, background: s.props.fill || s.props.stroke, borderRadius: 2, display: 'inline-block' }} />
              {s.props.name}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

/* ---------------------------------- date + math utils ---------------------------------- */

const pad = (n) => String(n).padStart(2, '0');
function monthBounds(monthStr) {
  const [y, m] = monthStr.split('-').map(Number);
  const start = new Date(y, m - 1, 1);
  const end = new Date(y, m, 0);
  end.setHours(0, 0, 0, 0);
  start.setHours(0, 0, 0, 0);
  return [start, end];
}
function currentMonthStr() {
  const t = today();
  return `${t.getFullYear()}-${pad(t.getMonth() + 1)}`;
}
function shiftMonthStr(monthStr, delta) {
  const [y, m] = monthStr.split('-').map(Number);
  const d = new Date(y, m - 1 + delta, 1);
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
}
function monthLabel(monthStr) {
  const [y, m] = monthStr.split('-').map(Number);
  return new Date(y, m - 1, 1).toLocaleDateString('en-IN', { month: 'long', year: 'numeric' });
}
const toISO = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const fromISO = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => { const r = new Date(d); r.setDate(r.getDate() + n); return r; };
const startOfWeek = (d) => { const r = new Date(d); const day = (r.getDay() + 6) % 7; return addDays(r, -day); };
const startOfMonth = (d) => new Date(d.getFullYear(), d.getMonth(), 1);
const endOfMonth = (d) => new Date(d.getFullYear(), d.getMonth() + 1, 0);
const startOfYear = (d) => new Date(d.getFullYear(), 0, 1);
const endOfYear = (d) => new Date(d.getFullYear(), 11, 31);
const today = () => { const t = new Date(); t.setHours(0, 0, 0, 0); return t; };
// Whole days between two ISO date strings (inclusive-friendly: same day = 1 day worked).
const daysBetween = (startISO, endISO) => {
  if (!startISO || !endISO) return null;
  return Math.max(1, Math.round((fromISO(endISO) - fromISO(startISO)) / 86400000) + 1);
};

function getRange(preset, customStart, customEnd) {
  const t = today();
  switch (preset) {
    case 'today': return [t, t];
    case 'yesterday': { const y = addDays(t, -1); return [y, y]; }
    case 'thisWeek': { const s = startOfWeek(t); return [s, addDays(s, 6)]; }
    case 'lastWeek': { const s = addDays(startOfWeek(t), -7); return [s, addDays(s, 6)]; }
    case 'thisMonth': return [startOfMonth(t), endOfMonth(t)];
    case 'lastMonth': { const m = new Date(t.getFullYear(), t.getMonth() - 1, 1); return [startOfMonth(m), endOfMonth(m)]; }
    case 'thisYear': return [startOfYear(t), endOfYear(t)];
    case 'custom': {
      if (!customStart || !customEnd) return [t, t];
      return [fromISO(customStart), fromISO(customEnd)];
    }
    default: return [t, t];
  }
}

const inRange = (dateISO, start, end) => { const d = fromISO(dateISO); return d >= start && d <= end; };

const inr = (n) => `\u20b9${Math.round(n || 0).toLocaleString('en-IN')}`;
const pct = (n) => `${(n || 0).toFixed(1)}%`;
const uid = () => Math.random().toString(36).slice(2, 10);

function hashCode(str) { let h = 0; for (let i = 0; i < str.length; i++) { h = (Math.imul(31, h) + str.charCodeAt(i)) | 0; } return h; }
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* ---------------------------------- calculations ---------------------------------- */

function findSalaryStructure(rates, id) {
  const list = rates.salaryStructures || [];
  return list.find((s) => s.id === id) || list[0] || { label: 'Unknown', perDelivery: 0, petrol: 0 };
}

function calcPayroll(delivered, employee, rates) {
  if (!employee) return { pay: 0, petrol: 0 };
  const structure = findSalaryStructure(rates, employee.salaryMethod);
  return { pay: delivered * (Number(structure.perDelivery) || 0), petrol: Number(structure.petrol) || 0 };
}

function calcRevenue(entry, rates) {
  return entry.delivered * (rates.revenue[entry.company] || 0);
}

function aggregate(entriesList, empById, rates) {
  let assigned = 0, delivered = 0, failed = 0, revenue = 0, payroll = 0, petrol = 0;
  entriesList.forEach((en) => {
    assigned += en.assigned; delivered += en.delivered; failed += en.failed;
    revenue += calcRevenue(en, rates);
    const emp = empById[en.employeeId];
    const { pay, petrol: p } = calcPayroll(en.delivered, emp, rates);
    payroll += pay; petrol += p;
  });
  const totalExpense = payroll + petrol;
  const profit = revenue - totalExpense;
  const successRate = assigned ? (delivered / assigned) * 100 : 0;
  const margin = revenue ? (profit / revenue) * 100 : 0;
  return { assigned, delivered, failed, revenue, payroll, petrol, totalExpense, profit, successRate, margin };
}

/* ---------------------------------- vendor payout helpers ----------------------------------
   A vendor's payout is rate (₹/delivery) × products delivered by their assigned employees.
   These are shared by every page that shows a profit figure, so "profit after vendor payout"
   means the same thing everywhere — Dashboard, Profit and loss, and the Reports tabs. */

// Employee id → total ₹/delivery rate across every vendor they're assigned to (normally just one).
function vendorRateByEmployeeMap(vendors) {
  const map = new Map();
  (vendors || []).forEach((v) => {
    const rate = Number(v.amount) || 0;
    if (!rate) return;
    (v.employeeIds || []).forEach((id) => map.set(id, (map.get(id) || 0) + rate));
  });
  return map;
}

// Total vendor payout implied by a set of entries (already filtered by date range / company /
// whatever else the caller cares about).
function totalVendorPayout(vendors, entriesList) {
  const rateMap = vendorRateByEmployeeMap(vendors);
  if (rateMap.size === 0) return 0;
  return entriesList.reduce((sum, en) => sum + (rateMap.get(en.employeeId) || 0) * en.delivered, 0);
}

function buildTrend(entriesList, empById, rates, start, end, vendors) {
  const vendorRateMap = vendorRateByEmployeeMap(vendors);
  const spanDays = Math.round((end - start) / 86400000) + 1;
  let keyFn, labelFn;
  if (spanDays <= 31) {
    keyFn = (d) => toISO(d);
    labelFn = (k) => fromISO(k).toLocaleDateString('en-IN', { day: '2-digit', month: 'short' });
  } else if (spanDays <= 366) {
    keyFn = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
    labelFn = (k) => { const [y, m] = k.split('-'); return new Date(Number(y), Number(m) - 1, 1).toLocaleDateString('en-IN', { month: 'short', year: '2-digit' }); };
  } else {
    keyFn = (d) => `${d.getFullYear()}`;
    labelFn = (k) => k;
  }
  const map = new Map();
  entriesList.forEach((en) => {
    const d = fromISO(en.date);
    const key = keyFn(d);
    if (!map.has(key)) map.set(key, { key, delivered: 0, failed: 0, revenue: 0, expense: 0 });
    const rec = map.get(key);
    rec.delivered += en.delivered; rec.failed += en.failed;
    rec.revenue += calcRevenue(en, rates);
    const emp = empById[en.employeeId];
    const { pay, petrol } = calcPayroll(en.delivered, emp, rates);
    rec.expense += pay + petrol;
    const vendorRate = vendorRateMap.get(en.employeeId);
    if (vendorRate) rec.expense += vendorRate * en.delivered;
  });
  return Array.from(map.values()).sort((a, b) => a.key.localeCompare(b.key))
    .map((r) => ({ ...r, label: labelFn(r.key), profit: r.revenue - r.expense }));
}

      .edm-root { --navy:#12192B; --navy-2:#1B2540; --navy-3:#243252; --amber:#E8963C; --amber-dark:#C97A28; --teal:#0E9488; --teal-dark:#0B7A70; --danger:#DC5B5B; --bg:#F4F5F7; --surface:#FFFFFF; --border:#E4E6EA; --text:#1B2233; --text-muted:#6B7280; font-family:'Inter',sans-serif; color:var(--text); background:var(--bg); }

      .edm-root .font-mono { font-family:'JetBrains Mono',monospace; }

      .edm-btn:active { transform:scale(0.98); }

// True once an employee has at least one payout route on file (UPI or full bank details).
function hasPayoutDetails(e) {
  if (!e) return false;
  if (e.upiId) return true;
  return !!(e.bankAccountNumber && e.bankIfsc);
}

function maskAccountNumber(num) {
  if (!num) return '';
  const s = String(num);
  if (s.length <= 4) return s;
  return `•••• ${s.slice(-4)}`;
}

// Compact cell: shows UPI ID if present, otherwise a masked bank account with a reveal toggle.
// Used in both Employee management and Salary management tables so payout info reads the same way everywhere.
function BankCell({ employee }) {
  const [revealed, setRevealed] = useState(false);
  if (!hasPayoutDetails(employee)) {
    return <span style={{ color: 'var(--text-muted)', fontSize: 12.5 }}>Not on file</span>;
  }
  return (
    <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
      {employee.upiId ? (
        <span className="font-mono" style={{ fontSize: 12.5 }}>{employee.upiId}</span>
      ) : (
        <span className="font-mono" style={{ fontSize: 12.5 }}>
          {revealed ? employee.bankAccountNumber : maskAccountNumber(employee.bankAccountNumber)}
        </span>
      )}
      {!employee.upiId && employee.bankAccountNumber && (
        <button
          type="button"
          className="edm-btn edm-btn-ghost"
          style={{ padding: 4 }}
          onClick={() => setRevealed((v) => !v)}
          title={revealed ? 'Hide account number' : 'Show account number'}
        >
          {revealed ? <EyeOff size={12} /> : <Eye size={12} />}
        </button>
      )}
    </div>
  );
}

// Builds a standard UPI deep link (upi://pay?...). Tapping it on a phone opens whichever UPI app
// (GPay, PhonePe, Paytm, BHIM, bank apps) the employee/admin has installed, with the amount and
// payee already filled in — the admin still confirms the payment with their own UPI PIN.
function buildUpiLink({ upiId, payeeName, amount, note }) {
  const params = new URLSearchParams({
    pa: upiId,
    pn: payeeName || '',
    am: Number(amount || 0).toFixed(2),
    cu: 'INR',
    tn: note || 'Salary payment',
  });
  return `upi://pay?${params.toString()}`;
}

function useUndoToast(duration = 6000) {
  const [toast, setToast] = useState(null); // { message, onUndo }
  const timeoutRef = useRef(null);
  const showUndo = (message, onUndo) => {
    clearTimeout(timeoutRef.current);
    setToast({ message, onUndo });
    timeoutRef.current = setTimeout(() => setToast(null), duration);
  };
  const dismiss = () => { clearTimeout(timeoutRef.current); setToast(null); };
  useEffect(() => () => clearTimeout(timeoutRef.current), []);
  return { toast, showUndo, dismiss };
}

function UndoToast({ toast, onDismiss }) {
  if (!toast) return null;
  return (
    <div

/* ---------------------------------- Sortable / filterable table headers ----------------------------------
   Generic helper used by every data table in the app: click a column header to sort by it (toggling
   asc/desc), and use the small control under the label to filter that column — a text box for free-text
   columns or a dropdown for columns with a fixed set of values. Kept generic so each page just declares
   its columns once instead of hand-rolling sorting/filtering per table. */
function useTableControls() {
  const [sort, setSort] = useState({ key: null, dir: 'asc' });
  const [filters, setFilters] = useState({});
  const toggleSort = (key) => setSort((s) => (s.key === key ? { key, dir: s.dir === 'asc' ? 'desc' : 'asc' } : { key, dir: 'asc' }));
  const setFilter = (key, value) => setFilters((f) => ({ ...f, [key]: value }));
  const clearFilters = () => setFilters({});

  const apply = (rows, columns) => {
    let out = rows;
    columns.forEach((col) => {
      const val = filters[col.key];
      if (val === undefined || val === null || val === '') return;
      out = out.filter((row) => {
        const cell = col.getValue(row);
        if (col.filterType === 'select') return String(cell ?? '') === val;
        return String(cell ?? '').toLowerCase().includes(String(val).toLowerCase());
      });
    });
    if (sort.key) {
      const col = columns.find((c) => c.key === sort.key);
      if (col) {
        out = [...out].sort((a, b) => {
          const av = col.getValue(a);
          const bv = col.getValue(b);
          const aEmpty = av === null || av === undefined || av === '';
          const bEmpty = bv === null || bv === undefined || bv === '';
          if (aEmpty && bEmpty) return 0;
          if (aEmpty) return 1;
          if (bEmpty) return -1;
          if (typeof av === 'number' && typeof bv === 'number') return av - bv;
          return String(av).localeCompare(String(bv), undefined, { numeric: true, sensitivity: 'base' });
        });
        out = sort.dir === 'asc' ? out : out.reverse();
      }
    }
    return out;
  };

  const activeCount = Object.values(filters).filter((v) => v !== undefined && v !== null && v !== '').length;
  return { sort, toggleSort, filters, setFilter, clearFilters, activeCount, apply };
}

// A <th> that's clickable to sort, and carries a small filter control (text input or select)
// for that column. Pass column=null for a plain, non-interactive header cell (e.g. an actions column).
function SortFilterTh({ label, column, sort, onSort, filterValue, onFilterChange, style }) {
  if (!column) return <th style={style}>{label}</th>;
  const isActive = sort.key === column.key;
  return (
    <th style={{ verticalAlign: 'bottom', ...style }}>
      <div
        style={{ display: 'flex', alignItems: 'center', gap: 4, cursor: 'pointer', userSelect: 'none' }}
        onClick={() => onSort(column.key)}
        title={`Sort by ${label}`}
      >
        {label}
        <span style={{ fontSize: 9, opacity: isActive ? 1 : 0.35 }}>{isActive ? (sort.dir === 'asc' ? '▲' : '▼') : '↕'}</span>
      </div>
      {column.filterType && column.filterType !== 'none' && (
        column.filterType === 'select' ? (
          <select
            className="edm-select"
            style={{ marginTop: 5, padding: '3px 6px', fontSize: 11, fontWeight: 400, textTransform: 'none', letterSpacing: 0 }}
            value={filterValue || ''}
            onClick={(e) => e.stopPropagation()}
            onChange={(e) => onFilterChange(column.key, e.target.value)}
          >
            <option value="">All</option>
            {column.filterOptions.map((o) => <option key={o} value={o}>{o}</option>)}
          </select>
        ) : (
          <input
            className="edm-input"
            style={{ marginTop: 5, padding: '3px 6px', fontSize: 11, fontWeight: 400, textTransform: 'none', letterSpacing: 0 }}
            value={filterValue || ''}
            placeholder="Filter…"
            onClick={(e) => e.stopPropagation()}
            onChange={(e) => onFilterChange(column.key, e.target.value)}
          />
        )
      )}
    </th>
  );
}

// Renders a full <thead><tr> from a column config array. Each column: { key, label, getValue,
// filterType: 'text'|'select'|'none', filterOptions? }. Non-sortable extra cells (checkboxes, actions)
// can be mixed in via `extraCells` — an array of { position: 'start'|'end', content, style }.
function SortFilterHead({ columns, controls, extraStart, extraEnd }) {
  return (
    <thead><tr>
      {extraStart}
      {columns.map((col) => (
        <SortFilterTh
          key={col.key}
          label={col.label}
          column={col.filterType === 'none' ? { key: col.key } : col}
          sort={controls.sort}
          onSort={controls.toggleSort}
          filterValue={controls.filters[col.key]}
          onFilterChange={controls.setFilter}
          style={col.style}
        />
      ))}
      {extraEnd}
    </tr></thead>
  );
}

/* ---------------------------------- Dashboard page ---------------------------------- */

function DashboardPage({ employees, entries, empById, rates, vendors = [] }) {
  const COMPANIES = useContext(CompaniesContext);
  const t = today();
  const [mStart, mEnd] = [startOfMonth(t), endOfMonth(t)];
  const monthEntries = entries.filter((en) => inRange(en.date, mStart, mEnd));
  const overall = aggregate(monthEntries, empById, rates);
  const trend = buildTrend(monthEntries, empById, rates, mStart, mEnd, vendors);

  const activeEmp = employees.filter((e) => e.status === 'Active').length;

  // Vendor payout this month: each vendor's rate × products delivered by their assigned
  // employees. This is money the business pays out, so it comes off net profit here too.
  const vendorBreakdown = vendors.map((v) => {
    const ids = new Set(v.employeeIds || []);
    const es = monthEntries.filter((en) => ids.has(en.employeeId));
    const delivered = es.reduce((s, en) => s + en.delivered, 0);
    const rate = Number(v.amount) || 0;
    return { ...v, employeeCount: ids.size, delivered, rate, payout: rate * delivered };
  });
  const totalVendorPayoutAmt = vendorBreakdown.reduce((s, v) => s + v.payout, 0);
  const netProfit = overall.profit - totalVendorPayoutAmt;
  const netMargin = overall.revenue ? (netProfit / overall.revenue) * 100 : 0;

  return (
    <div>

                <CartesianGrid stroke="#EEF0F2" vertical={false} />

          const cNetProfit = a.profit - cVendorPayout;

            <div key={c} className="edm-card" style={{ padding: 18 }}>

  );
}

  return { id: '', name: '', simName: '', mobile: '', address: '', hubLocation: '', joiningDate: toISO(today()), company: companies?.[0] || '', salaryMethod: salaryStructures?.[0]?.id || '', status: 'Active', relievingDate: '', relievingReason: '', bankAccountName: '', bankAccountNumber: '', bankIfsc: '', upiId: '' };
}

        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12 }}>
          <div>
            <label className="edm-label">Account number</label>
            <input
              className="edm-input font-mono"
              value={form.bankAccountNumber || ''}
              onChange={(e) => set('bankAccountNumber', e.target.value.replace(/[^\dA-Za-z]/g, ''))}
              placeholder="Bank account number"
              inputMode="numeric"
            />

          <div>
            <label className="edm-label">IFSC code</label>
            <input
              className="edm-input font-mono"
              value={form.bankIfsc || ''}

        )}

        >
          {isEdit ? 'Save changes' : 'Add employee'}
        </button>
        <button className="edm-btn edm-btn-ghost" onClick={onClose}>Cancel</button>
      </div>
    </div>
  );
}

function toCsvValue(val) {
  const s = val === null || val === undefined ? '' : String(val);
  if (/[",\n]/.test(s)) return `"${s.replace(/"/g, '""')}"`;
  return s;
}

function downloadCsv(filename, rows) {
  const csv = rows.map((row) => row.map(toCsvValue).join(',')).join('\r\n');
  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

const BACKUP_SCHEMA_VERSION = 1;

function downloadJson(filename, data) {
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// Bundles every piece of persisted app data into one exportable object.
function buildBackupPayload({ companies, employees, entries, rates, hubLocations, vendors }) {
  return {
    schema: 'edm-backup',
    version: BACKUP_SCHEMA_VERSION,
    exportedAt: new Date().toISOString(),
    companies, employees, entries, rates, hubLocations: hubLocations || [], vendors: vendors || [],
  };
}

// Basic shape check before trusting an imported file.
function validateBackupPayload(data) {
  if (!data || typeof data !== 'object') return 'File is not a valid backup (not a JSON object).';
  if (!Array.isArray(data.employees)) return 'File is missing an "employees" list.';
  if (!Array.isArray(data.entries)) return 'File is missing an "entries" list.';
  if (!Array.isArray(data.companies)) return 'File is missing a "companies" list.';
  if (!data.rates || typeof data.rates !== 'object') return 'File is missing "rates" data.';
  // hubLocations is optional for backward compatibility with backups made before this feature existed.
  return null;
}

function EmployeesPage({ employees, setEmployees, empById, entries, rates }) {
  const COMPANIES = useContext(CompaniesContext);
  const HUB_LOCATIONS = useContext(HubLocationsContext);
  const [modal, setModal] = useState(null);
  const [deleteId, setDeleteId] = useState(null);
  const [companyFilter, setCompanyFilter] = useState('All');
  const [statusFilter, setStatusFilter] = useState('All');

  const list = employees.filter((e) => (companyFilter === 'All' || e.company === companyFilter) && (statusFilter === 'All' || e.status === statusFilter));
  const activeCount = employees.filter((e) => e.status === 'Active').length;
  const inactiveCount = employees.filter((e) => e.status === 'Inactive').length;
  const salaryStructures = rates.salaryStructures || [];
  const methodLabel = (id) => {
    const s = salaryStructures.find((x) => x.id === id);
    if (!s) return '—';
    return `${s.label} (₹${s.perDelivery}${s.petrol ? ' + petrol' : ''})`;
  };

  const monthEntries = useMemo(() => entries.filter((en) => inRange(en.date, startOfMonth(today()), endOfMonth(today()))), [entries]);
  const deliveredThisMonth = (empId) => monthEntries.filter((en) => en.employeeId === empId).reduce((s, en) => s + en.delivered, 0);

  // The filter dropdown offers every configured hub location plus any legacy value still on
  // an employee record but no longer in the Settings list, so no employee's filter disappears.
  const hubLocationOptions = useMemo(() => {
    const extra = employees.map((e) => e.hubLocation).filter(Boolean);
    return Array.from(new Set([...HUB_LOCATIONS, ...extra]));
  }, [HUB_LOCATIONS, employees]);

  const tableControls = useTableControls();
  const columns = [
    { key: 'id', label: 'ID', getValue: (e) => e.id, filterType: 'text' },
    { key: 'name', label: 'Name', getValue: (e) => e.name, filterType: 'text' },
    { key: 'simName', label: 'SIM name', getValue: (e) => e.simName || '', filterType: 'text' },
    { key: 'mobile', label: 'Mobile', getValue: (e) => e.mobile, filterType: 'text' },
    { key: 'company', label: 'Company', getValue: (e) => e.company, filterType: 'select', filterOptions: COMPANIES },
    { key: 'hubLocation', label: 'Hub location', getValue: (e) => e.hubLocation || '', filterType: 'select', filterOptions: hubLocationOptions },
    { key: 'salaryMethod', label: 'Salary method', getValue: (e) => methodLabel(e.salaryMethod), filterType: 'text' },
    { key: 'bank', label: 'Bank / UPI', getValue: (e) => e.upiId || e.bankAccountNumber || e.bankAccountName || '', filterType: 'text' },
    { key: 'joiningDate', label: 'Joined', getValue: (e) => e.joiningDate, filterType: 'text' },
    { key: 'status', label: 'Status', getValue: (e) => e.status, filterType: 'select', filterOptions: ['Active', 'Inactive'] },
    { key: 'delivered', label: 'Delivered (month)', getValue: (e) => deliveredThisMonth(e.id), filterType: 'text' },
  ];
  const visibleList = tableControls.apply(list, columns);

  const exportEmployeesCsv = () => {
    const header = ['ID', 'Name', 'SIM name', 'Mobile', 'Address', 'Company', 'Hub location', 'Salary method', 'Per delivery (₹)', 'Petrol / day (₹)', 'Joining date', 'Status', 'Relieving date', 'Relieving reason', 'Delivered (this month)', 'UPI ID', 'Bank account name', 'Bank account number', 'IFSC'];
    const rows = visibleList.map((e) => {
      const s = salaryStructures.find((x) => x.id === e.salaryMethod);
      return [
        e.id, e.name, e.simName || '', e.mobile, e.address, e.company, e.hubLocation || '',
        s ? s.label : '—', s ? s.perDelivery : '', s ? s.petrol : '',
        e.joiningDate, e.status, e.relievingDate || '', e.relievingReason || '', deliveredThisMonth(e.id),
        e.upiId || '', e.bankAccountName || '', e.bankAccountNumber || '', e.bankIfsc || '',
      ];
    });
    downloadCsv(`employees_${toISO(today())}.csv`, [header, ...rows]);
  };

  const addEmployee = (form) => {
    setEmployees((prev) => [...prev, { ...form, id: `e${uid()}` }]);
    setModal(null);
  };
  const updateEmployee = (form) => {
    setEmployees((prev) => prev.map((e) => (e.id === form.id ? form : e)));
    setModal(null);
  };
  const { toast, showUndo, dismiss } = useUndoToast();
  const removeEmployee = (id) => {
    const idx = employees.findIndex((e) => e.id === id);
    const removed = employees[idx];
    setEmployees((prev) => prev.filter((e) => e.id !== id));
    setDeleteId(null);
    if (removed) {
      showUndo(`Deleted ${removed.name}`, () => {
        setEmployees((prev) => {
          if (prev.some((e) => e.id === removed.id)) return prev;
          const copy = [...prev];
          copy.splice(Math.min(idx, copy.length), 0, removed);
          return copy;
        });
      });
    }
  };

  return (
    <div>
      <SectionHeader
        title="Employee management"
        subtitle={`${employees.length} employees across ${COMPANIES.length} compan${COMPANIES.length === 1 ? 'y' : 'ies'} · ${activeCount} active${inactiveCount > 0 ? ` · ${inactiveCount} inactive` : ''}`}
        right={
          <div style={{ display: 'flex', gap: 8 }}>
            <button className="edm-btn edm-btn-ghost" onClick={exportEmployeesCsv}><Download size={15} /> Export CSV</button>
            <button className="edm-btn edm-btn-amber" onClick={() => setModal({ mode: 'add' })}><Plus size={15} /> Add employee</button>
          </div>
        }
      />

      <div style={{ display: 'flex', gap: 8, marginBottom: 12, flexWrap: 'wrap' }}>
        {['All', ...COMPANIES].map((c) => (

          <tbody>

                <td style={{ fontWeight: 600 }}>{e.name}</td>
                <td style={{ color: e.simName ? 'var(--text)' : 'var(--text-muted)' }}>{e.simName || '—'}</td>
                <td className="font-mono">{e.mobile}</td>

                <td style={{ color: e.hubLocation ? 'var(--text)' : 'var(--text-muted)' }}>{e.hubLocation || '—'}</td>

                <td>{e.joiningDate}</td>
                <td><StatusBadge status={e.status} /></td>
                <td className="font-mono">{deliveredThisMonth(e.id)}</td>

                    <button className="edm-btn edm-btn-ghost" style={{ padding: 6 }} onClick={() => setModal({ mode: 'edit', employee: e })}><Pencil size={13} /></button>

        </Modal>
      )}
      {modal?.mode === 'edit' && (
        <Modal title="Edit employee" onClose={() => setModal(null)}>
          <EmployeeForm initial={{ ...modal.employee }} salaryStructures={salaryStructures} onSave={updateEmployee} onClose={() => setModal(null)} />
        </Modal>
      )}
      {deleteId && (
        <Modal title="Delete employee" onClose={() => setDeleteId(null)} width={380}>
          <p style={{ fontSize: 13.5, color: 'var(--text-muted)', margin: '0 0 16px' }}>This removes {empById[deleteId]?.name} from the employee list. Their past daily entries stay on record. You'll have a few seconds to undo right after.</p>
          <div style={{ display: 'flex', gap: 10 }}>
            <button className="edm-btn" style={{ flex: 1, justifyContent: 'center', background: 'var(--danger)', color: '#fff' }} onClick={() => removeEmployee(deleteId)}>Delete</button>
            <button className="edm-btn edm-btn-ghost" onClick={() => setDeleteId(null)}>Cancel</button>
          </div>
        </Modal>
      )}
      <UndoToast toast={toast} onDismiss={dismiss} />
    </div>
  );
}

function InactiveEmployeesPage({ employees, setEmployees, empById, rates }) {
  const COMPANIES = useContext(CompaniesContext);
  const [companyFilter, setCompanyFilter] = useState('All');
  const [modal, setModal] = useState(null);
  const [deleteId, setDeleteId] = useState(null);
  const { toast, showUndo, dismiss } = useUndoToast();

  const salaryStructures = rates.salaryStructures || [];
  const methodLabel = (id) => {
    const s = salaryStructures.find((x) => x.id === id);
    return s ? `${s.label} (₹${s.perDelivery}${s.petrol ? ' + petrol' : ''})` : '—';
  };

  const list = employees
    .filter((e) => e.status === 'Inactive' && (companyFilter === 'All' || e.company === companyFilter))
    .sort((a, b) => (b.relievingDate || '').localeCompare(a.relievingDate || ''));

  const tableControls = useTableControls();
  const columns = [
    { key: 'name', label: 'Name', getValue: (e) => e.name, filterType: 'text' },
    { key: 'company', label: 'Company', getValue: (e) => e.company, filterType: 'select', filterOptions: COMPANIES },
    { key: 'salaryMethod', label: 'Salary method', getValue: (e) => methodLabel(e.salaryMethod), filterType: 'text' },
    { key: 'joiningDate', label: 'Joined', getValue: (e) => e.joiningDate, filterType: 'text' },
    { key: 'relievingDate', label: 'Relieved', getValue: (e) => e.relievingDate || '', filterType: 'text' },
    { key: 'daysActive', label: 'Days active', getValue: (e) => daysBetween(e.joiningDate, e.relievingDate) ?? '', filterType: 'text' },
    { key: 'relievingReason', label: 'Reason', getValue: (e) => e.relievingReason || '', filterType: 'text' },
  ];
  const visibleList = tableControls.apply(list, columns);

  const exportCsv = () => {
    const header = ['ID', 'Name', 'Company', 'Salary method', 'Joining date', 'Relieving date', 'Days active', 'Reason'];
    const rows = visibleList.map((e) => [
      e.id, e.name, e.company, methodLabel(e.salaryMethod),
      e.joiningDate, e.relievingDate || '', daysBetween(e.joiningDate, e.relievingDate) ?? '', e.relievingReason || '',
    ]);
    downloadCsv(`inactive_employees_${toISO(today())}.csv`, [header, ...rows]);
  };

  const updateEmployee = (form) => {
    setEmployees((prev) => prev.map((e) => (e.id === form.id ? form : e)));
    setModal(null);
  };

  const reactivate = (id) => {
    const previous = employees.find((e) => e.id === id);
    if (!previous) return;
    setEmployees((prev) => prev.map((e) => (e.id === id ? { ...e, status: 'Active', relievingDate: '', relievingReason: '' } : e)));
    showUndo(`${previous.name} marked active again`, () => {
      setEmployees((prev) => prev.map((e) => (e.id === id ? previous : e)));
    });
  };

  const removeEmployee = (id) => {
    const idx = employees.findIndex((e) => e.id === id);
    const removed = employees[idx];
    setEmployees((prev) => prev.filter((e) => e.id !== id));
    setDeleteId(null);
    if (removed) {
      showUndo(`Deleted ${removed.name}`, () => {
        setEmployees((prev) => {
          if (prev.some((e) => e.id === removed.id)) return prev;
          const copy = [...prev];
          copy.splice(Math.min(idx, copy.length), 0, removed);
          return copy;
        });
      });
    }
  };

  return (
    <div>
      <SectionHeader
        title="Inactive employees"
        subtitle={`${list.length} employee${list.length === 1 ? '' : 's'} relieved — tracked from their joining date through to their relieving date`}
        right={<button className="edm-btn edm-btn-ghost" onClick={exportCsv}><Download size={15} /> Export CSV</button>}
      />

      <div style={{ display: 'flex', gap: 8, marginBottom: 16, flexWrap: 'wrap' }}>
        {['All', ...COMPANIES].map((c) => (
          <button key={c} className={`edm-btn ${companyFilter === c ? 'edm-btn-primary' : 'edm-btn-ghost'}`} onClick={() => setCompanyFilter(c)}>{c}</button>
        ))}
      </div>

      <div className="edm-card edm-scroll" style={{ overflowX: 'auto' }}>
        <table className="edm-table">
          <SortFilterHead columns={columns} controls={tableControls} extraEnd={<th></th>} />
          <tbody>
            {visibleList.map((e) => {
              const days = daysBetween(e.joiningDate, e.relievingDate);
              return (
                <tr key={e.id}>
                  <td style={{ fontWeight: 600 }}>{e.name}</td>
                  <td>{e.company}</td>
                  <td>{methodLabel(e.salaryMethod)}</td>
                  <td>{e.joiningDate}</td>
                  <td>
                    {e.relievingDate
                      ? <span style={{ fontWeight: 600 }}>{e.relievingDate}</span>
                      : <span style={{ color: 'var(--text-muted)' }}>Not recorded</span>}
                  </td>
                  <td className="font-mono">{days ?? '—'}</td>
                  <td style={{ color: 'var(--text-muted)', maxWidth: 180, overflow: 'hidden', textOverflow: 'ellipsis' }}>{e.relievingReason || '—'}</td>
                  <td>
                    <div style={{ display: 'flex', gap: 6 }}>
                      <button className="edm-btn edm-btn-ghost" style={{ padding: '5px 9px', fontSize: 12 }} onClick={() => reactivate(e.id)}>Reactivate</button>
                      <button className="edm-btn edm-btn-ghost" style={{ padding: 6 }} onClick={() => setModal({ mode: 'edit', employee: e })}><Pencil size={13} /></button>
                      <button className="edm-btn edm-btn-danger-ghost" style={{ padding: 6 }} onClick={() => setDeleteId(e.id)}><Trash2 size={13} /></button>
                    </div>
                  </td>
                </tr>
              );
            })}
            {visibleList.length === 0 && <tr><td colSpan={8} style={{ textAlign: 'center', color: 'var(--text-muted)', padding: 24 }}>No inactive employees{companyFilter !== 'All' ? ` for ${companyFilter}` : ''} on record.</td></tr>}
          </tbody>
        </table>
      </div>

      {modal?.mode === 'edit' && (
        <Modal title="Edit relieved employee" onClose={() => setModal(null)}>
          <EmployeeForm initial={{ ...modal.employee }} salaryStructures={salaryStructures} onSave={updateEmployee} onClose={() => setModal(null)} />
        </Modal>
      )}
      {deleteId && (
        <Modal title="Delete employee" onClose={() => setDeleteId(null)} width={380}>
          <p style={{ fontSize: 13.5, color: 'var(--text-muted)', margin: '0 0 16px' }}>This permanently removes {empById[deleteId]?.name} from the employee list. Their past daily entries stay on record. You'll have a few seconds to undo right after.</p>
          <div style={{ display: 'flex', gap: 10 }}>
            <button className="edm-btn" style={{ flex: 1, justifyContent: 'center', background: 'var(--danger)', color: '#fff' }} onClick={() => removeEmployee(deleteId)}>Delete</button>
            <button className="edm-btn edm-btn-ghost" onClick={() => setDeleteId(null)}>Cancel</button>
          </div>
        </Modal>
      )}
      <UndoToast toast={toast} onDismiss={dismiss} />
    </div>
  );
}
