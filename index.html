function QuickEntryGrid({ date, company, employees, entries, setEntries, empById }) {
  const COMPANIES = useContext(CompaniesContext);
  const activeEmployees = useMemo(
    () => employees.filter((e) => e.status === 'Active' && (company === 'All' || e.company === company)),
    [employees, company]
  );

  const buildRows = () => activeEmployees.map((emp) => {
    const existing = entries.find((en) => en.employeeId === emp.id && en.date === date);
    return {
      employeeId: emp.id,
      entryId: existing ? existing.id : null,
      assigned: existing ? String(existing.assigned) : '',
      delivered: existing ? String(existing.delivered) : '',
      remarks: existing ? existing.remarks : '',
    };
  });

  const [rows, setRows] = useState(buildRows);
  const [flash, setFlash] = useState({});

  // Rebuild rows whenever the date/company filter or the active employee list changes.
  // We deliberately key on entries.length (not the whole array) so saving one row doesn't
  // reset in-progress typing on the others — new entries still get picked up immediately.
  useEffect(() => { setRows(buildRows()); }, [date, company, employees, entries.length]); // eslint-disable-line react-hooks/exhaustive-deps

  const setRow = (employeeId, patch) => {
    setRows((prev) => prev.map((r) => (r.employeeId === employeeId ? { ...r, ...patch } : r)));
  };

  const saveRow = (employeeId) => {
    const row = rows.find((r) => r.employeeId === employeeId);
    const emp = empById[employeeId];
    if (!row || !emp) return;
    if (row.assigned === '' && row.delivered === '' && !row.remarks) return;
    const assigned = Number(row.assigned) || 0;
    const delivered = Math.min(assigned, Number(row.delivered) || 0);
    const failed = Math.max(0, assigned - delivered);
    const record = { id: row.entryId || uid(), date, company: emp.company, employeeId, assigned, delivered, failed, remarks: row.remarks || '' };
    setEntries((prev) => {
      const idx = prev.findIndex((en) => en.id === record.id);
      if (idx >= 0) { const copy = [...prev]; copy[idx] = record; return copy; }
      return [...prev, record];
    });
    setRows((prev) => prev.map((r) => (r.employeeId === employeeId ? { ...r, entryId: record.id } : r)));
    setFlash((f) => ({ ...f, [employeeId]: true }));
    setTimeout(() => setFlash((f) => ({ ...f, [employeeId]: false })), 1400);
  };

  const tableControls = useTableControls();
  const columns = [
    { key: 'employee', label: 'Employee', getValue: (r) => empById[r.employeeId]?.name || r.employeeId, filterType: 'text' },
    { key: 'company', label: 'Company', getValue: (r) => empById[r.employeeId]?.company || '', filterType: 'select', filterOptions: COMPANIES },
    { key: 'assigned', label: 'Assigned', getValue: (r) => Number(r.assigned) || 0, filterType: 'text' },
    { key: 'delivered', label: 'Delivered', getValue: (r) => Number(r.delivered) || 0, filterType: 'text' },
    { key: 'failed', label: 'Failed', getValue: (r) => Math.max(0, (Number(r.assigned) || 0) - Math.min(Number(r.assigned) || 0, Number(r.delivered) || 0)), filterType: 'text' },
    { key: 'remarks', label: 'Remarks', getValue: (r) => r.remarks || '', filterType: 'text' },
  ];
  const visibleRows = tableControls.apply(rows, columns);

  if (activeEmployees.length === 0) {
    return (
      <div className="edm-card" style={{ padding: 20, textAlign: 'center', color: 'var(--text-muted)', marginBottom: 16, fontSize: 13 }}>
        No active employees{company !== 'All' ? ` for ${company}` : ''} to list here.
      </div>
    );
  }

  return (
    <div className="edm-card edm-scroll" style={{ overflowX: 'auto', marginBottom: 16 }}>
      <div style={{ padding: '14px 16px 10px' }}>
        <h3 className="font-display" style={{ fontSize: 14, fontWeight: 700, margin: '0 0 2px' }}>Quick entry — active employees</h3>
        <p style={{ fontSize: 12, color: 'var(--text-muted)', margin: 0 }}>Every active employee is listed already — fill in numbers and click away to save, no need to add each one manually.</p>
      </div>
      <table className="edm-table">
        <SortFilterHead columns={columns} controls={tableControls} extraEnd={<th style={{ width: 60 }}></th>} />
        <tbody>
          {visibleRows.map((row) => {
            const emp = empById[row.employeeId];
            const assigned = Number(row.assigned) || 0;
            const delivered = Math.min(assigned, Number(row.delivered) || 0);
            const failed = Math.max(0, assigned - delivered);
            return (
              <tr key={row.employeeId}>
                <td style={{ fontWeight: 600 }}>{emp ? emp.name : row.employeeId}</td>
                <td>{emp ? emp.company : ''}</td>
                <td style={{ minWidth: 88 }}>
                  <input type="number" min="0" className="edm-input" style={{ padding: '5px 8px' }}
                    value={row.assigned}
                    onChange={(e) => setRow(row.employeeId, { assigned: e.target.value })}
                    onBlur={() => saveRow(row.employeeId)}
                    placeholder="0" />
                </td>
                <td style={{ minWidth: 88 }}>
                  <input type="number" min="0" className="edm-input" style={{ padding: '5px 8px' }}
                    value={row.delivered}
                    onChange={(e) => setRow(row.employeeId, { delivered: e.target.value })}
                    onBlur={() => saveRow(row.employeeId)}
                    placeholder="0" />
                </td>
                <td className="font-mono" style={{ color: 'var(--danger)' }}>{failed}</td>
                <td style={{ minWidth: 150 }}>
                  <input className="edm-input" style={{ padding: '5px 8px' }}
                    value={row.remarks}
                    onChange={(e) => setRow(row.employeeId, { remarks: e.target.value })}
                    onBlur={() => saveRow(row.employeeId)}
                    placeholder="Notes" />
                </td>
                <td>
                  {flash[row.employeeId]
                    ? <CheckCircle2 size={15} color="var(--teal-dark)" />
                    : (row.entryId ? <span style={{ fontSize: 11, color: 'var(--text-muted)' }}>Saved</span> : null)}
                </td>
              </tr>
            );
          })}
          {visibleRows.length === 0 && <tr><td colSpan={7} style={{ textAlign: 'center', color: 'var(--text-muted)', padding: 24 }}>No employees match the current filters.</td></tr>}
        </tbody>
      </table>
    </div>
  );
}

function DailyEntryPage({ employees, entries, setEntries, empById, rates }) {
  const COMPANIES = useContext(CompaniesContext);
  const [date, setDate] = useState(toISO(today()));
  const [company, setCompany] = useState('All');
  const [modal, setModal] = useState(null);
  const [deleteId, setDeleteId] = useState(null);
  const [monthModalOpen, setMonthModalOpen] = useState(false);

  const dayEntries = entries.filter((en) => en.date === date && (company === 'All' || en.company === company));
  const dayAgg = aggregate(dayEntries, empById, rates);

  const tableControls = useTableControls();
  const reportColumns = [
    { key: 'employee', label: 'Employee', getValue: (en) => empById[en.employeeId]?.name || 'Unknown', filterType: 'text' },
    { key: 'assigned', label: 'Assigned', getValue: (en) => en.assigned, filterType: 'text' },
    { key: 'delivered', label: 'Delivered', getValue: (en) => en.delivered, filterType: 'text' },
    { key: 'failed', label: 'Failed', getValue: (en) => en.failed, filterType: 'text' },
    { key: 'successRate', label: 'Success %', getValue: (en) => en.assigned ? (en.delivered / en.assigned) * 100 : 0, filterType: 'text' },
    { key: 'remarks', label: 'Remarks', getValue: (en) => en.remarks || '', filterType: 'text' },
  ];
  const visibleEntries = tableControls.apply(dayEntries, reportColumns);

  // Which employees' rows to include when the report is exported/shared. Empty selection
  // means "everyone visible" — checking specific employees narrows the shared report to just them.
  const [selectedIds, setSelectedIds] = useState(() => new Set());
  useEffect(() => { setSelectedIds(new Set()); }, [date, company]);

  const allSelected = visibleEntries.length > 0 && visibleEntries.every((en) => selectedIds.has(en.id));
  const toggleAll = () => setSelectedIds((prev) => {
    const next = new Set(prev);
    if (allSelected) visibleEntries.forEach((en) => next.delete(en.id));
    else visibleEntries.forEach((en) => next.add(en.id));
    return next;
  });
  const toggleOne = (id) => setSelectedIds((prev) => {
    const next = new Set(prev);
    if (next.has(id)) next.delete(id); else next.add(id);
    return next;
  });
  const clearSelection = () => setSelectedIds(new Set());

  const hasSelection = selectedIds.size > 0;
  const reportEntries = hasSelection ? visibleEntries.filter((en) => selectedIds.has(en.id)) : visibleEntries;
  const reportAgg = aggregate(reportEntries, empById, rates);

  const { toast, showUndo, dismiss } = useUndoToast();

  const reportRef = useRef(null);
  const [isSharing, setIsSharing] = useState(false);
  const dateLabel = fromISO(date).toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });

  const shareReport = () => {
    if (isSharing || !reportRef.current || typeof html2canvas === 'undefined') return;
    setIsSharing(true);
  };

  // isSharing flips true first so the table can hide unselected rows in the DOM; we wait for
  // that re-render (via requestAnimationFrame) before capturing, so the screenshot matches
  // exactly what's on screen at the moment of export.
  useEffect(() => {
    if (!isSharing) return;
    const raf = requestAnimationFrame(() => {
      html2canvas(reportRef.current, {
        backgroundColor: '#ffffff',
        scale: 2,
        ignoreElements: (el) => el.classList && el.classList.contains('no-print'),
      }).then((canvas) => {
        canvas.toBlob((blob) => {
          if (!blob) { setIsSharing(false); return; }
          const suffix = hasSelection ? `-${selectedIds.size}employees` : '';
          const fileName = `daily-report-${date}${company !== 'All' ? '-' + company.replace(/\s+/g, '') : ''}${suffix}.png`;
          const file = new File([blob], fileName, { type: 'image/png' });
          const shareText = hasSelection
            ? `Daily delivery report — ${dateLabel} (${selectedIds.size} employee${selectedIds.size === 1 ? '' : 's'})`
            : `Daily delivery report — ${dateLabel}`;
          const finish = () => setIsSharing(false);
          if (navigator.canShare && navigator.canShare({ files: [file] })) {
            navigator.share({ files: [file], title: 'Daily delivery report', text: shareText })
              .catch(() => {}).finally(finish);
          } else {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = fileName; document.body.appendChild(a); a.click(); a.remove();
            URL.revokeObjectURL(url);
            finish();
          }
        }, 'image/png');
      }).catch(() => setIsSharing(false));
    });
    return () => cancelAnimationFrame(raf);
  }, [isSharing]); // eslint-disable-line react-hooks/exhaustive-deps

  const upsertEntry = (form) => {
    const assigned = Number(form.assigned) || 0;
    const delivered = Math.min(assigned, Number(form.delivered) || 0);
    const failed = Math.max(0, assigned - delivered);
    const record = { ...form, assigned, delivered, failed };
    setEntries((prev) => {
      const idx = prev.findIndex((en) => en.id === record.id);
      if (idx >= 0) { const copy = [...prev]; copy[idx] = record; return copy; }
      return [...prev, record];
    });
    setModal(null);
  };

  const removeEntry = (id) => {
    const idx = entries.findIndex((en) => en.id === id);
    const removed = entries[idx];
    setEntries((prev) => prev.filter((en) => en.id !== id));
    setDeleteId(null);
    if (removed) {
      showUndo('Deleted delivery entry', () => {
        setEntries((prev) => {
          if (prev.some((en) => en.id === removed.id)) return prev;
          const copy = [...prev];
          copy.splice(Math.min(idx, copy.length), 0, removed);
          return copy;
        });
      });
    }
  };

  return (
    <div>
      <SectionHeader
        title="Daily delivery entry"
        subtitle="Record each employee's deliveries for the day — reports update automatically"
        right={
          <div className="no-print" style={{ display: 'flex', gap: 8, alignItems: 'center', flexWrap: 'wrap' }}>
            {hasSelection && (
              <span style={{ fontSize: 12, color: 'var(--amber-dark)', fontWeight: 600, display: 'flex', alignItems: 'center', gap: 6 }}>
                {selectedIds.size} of {dayEntries.length} selected
                <button className="edm-btn edm-btn-ghost" style={{ padding: '3px 8px', fontSize: 11.5 }} onClick={clearSelection}>Clear</button>
              </span>
            )}
            <button className="edm-btn edm-btn-ghost" disabled={isSharing} onClick={shareReport}>
              <Share2 size={15} /> {isSharing ? 'Preparing…' : hasSelection ? `Share selected (${selectedIds.size})` : 'Share / export report'}
            </button>
            <button className="edm-btn edm-btn-ghost" onClick={() => setMonthModalOpen(true)}><CalendarDays size={15} /> Monthly entry (one employee)</button>
            <button className="edm-btn edm-btn-amber" onClick={() => setModal({ mode: 'add' })}><Plus size={15} /> Add entry (other employee)</button>
          </div>
        }
      />

      <div className="edm-card" style={{ padding: 14, display: 'flex', gap: 14, alignItems: 'flex-end', marginBottom: 16, flexWrap: 'wrap' }}>
        <div><label className="edm-label">Date</label><input type="date" className="edm-input" value={date} onChange={(e) => setDate(e.target.value)} /></div>
        <div style={{ minWidth: 180 }}>
          <label className="edm-label">Company</label>
          <select className="edm-select" value={company} onChange={(e) => setCompany(e.target.value)}>
            <option value="All">All companies</option>
            {COMPANIES.map((c) => <option key={c} value={c}>{c}</option>)}
          </select>
        </div>
        <div style={{ display: 'flex', gap: 18, marginLeft: 'auto', flexWrap: 'wrap' }}>
          <div><div className="edm-label">Assigned</div><div className="font-mono" style={{ fontWeight: 700 }}>{dayAgg.assigned}</div></div>
          <div><div className="edm-label">Delivered</div><div className="font-mono" style={{ fontWeight: 700, color: 'var(--teal-dark)' }}>{dayAgg.delivered}</div></div>
          <div><div className="edm-label">Failed</div><div className="font-mono" style={{ fontWeight: 700, color: 'var(--danger)' }}>{dayAgg.failed}</div></div>
          <div><div className="edm-label">Success rate</div><RouteProgress percent={dayAgg.successRate} width={80} /></div>
        </div>
      </div>

      <QuickEntryGrid date={date} company={company} employees={employees} entries={entries} setEntries={setEntries} empById={empById} />

      <div ref={reportRef} style={{ background: '#fff' }}>
        <div className="edm-card" style={{ padding: 16, borderRadius: '12px 12px 0 0', borderBottom: 'none' }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: 10 }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
              <img src={LOGO_DATA_URI} alt="" style={{ width: 32, height: 32, objectFit: 'contain', flexShrink: 0 }} />
              <div>
                <div className="font-display" style={{ fontSize: 16, fontWeight: 700 }}>{COMPANY_NAME}</div>
                <div style={{ fontSize: 12, color: 'var(--text-muted)' }}>Daily delivery report — {dateLabel}{company !== 'All' ? ` · ${company}` : ''}</div>
              </div>
            </div>
            <div style={{ display: 'flex', gap: 16, flexWrap: 'wrap', fontSize: 12.5 }}>
              <div><span style={{ color: 'var(--text-muted)' }}>Assigned </span><span className="font-mono" style={{ fontWeight: 700 }}>{reportAgg.assigned}</span></div>
              <div><span style={{ color: 'var(--text-muted)' }}>Delivered </span><span className="font-mono" style={{ fontWeight: 700, color: 'var(--teal-dark)' }}>{reportAgg.delivered}</span></div>
              <div><span style={{ color: 'var(--text-muted)' }}>Failed </span><span className="font-mono" style={{ fontWeight: 700, color: 'var(--danger)' }}>{reportAgg.failed}</span></div>
              <div><span style={{ color: 'var(--text-muted)' }}>Success </span><span className="font-mono" style={{ fontWeight: 700 }}>{pct(reportAgg.successRate)}</span></div>
            </div>
          </div>
        </div>
        <div className="edm-card edm-scroll" style={{ overflowX: 'auto', borderRadius: '0 0 12px 12px' }}>
          <table className="edm-table">
            <SortFilterHead
              columns={reportColumns}
              controls={tableControls}
              extraStart={
                <th className="no-print" style={{ width: 34 }}>
                  <input type="checkbox" checked={allSelected} onChange={toggleAll} disabled={visibleEntries.length === 0} title="Select all" />
                </th>
              }
              extraEnd={<th className="no-print"></th>}
            />
            <tbody>
              {visibleEntries.map((en) => {
                const emp = empById[en.employeeId];
                const rate = en.assigned ? (en.delivered / en.assigned) * 100 : 0;
                const isSelected = selectedIds.has(en.id);
                // Only unselected rows disappear, and only for the moment we're capturing the
                // export image — the checkbox stays fully usable while just browsing/selecting.
                const rowHidden = isSharing && hasSelection && !isSelected;
                return (
                  <tr key={en.id} style={rowHidden ? { display: 'none' } : undefined}>
                    <td className="no-print">
                      <input type="checkbox" checked={isSelected} onChange={() => toggleOne(en.id)} />
                    </td>
                    <td style={{ fontWeight: 600 }}>{emp ? emp.name : 'Unknown'}</td>
                    <td className="font-mono">{en.assigned}</td>
                    <td className="font-mono" style={{ color: 'var(--teal-dark)' }}>{en.delivered}</td>
                    <td className="font-mono" style={{ color: 'var(--danger)' }}>{en.failed}</td>
                    <td className="font-mono">{pct(rate)}</td>
                    <td style={{ color: 'var(--text-muted)', maxWidth: 160, overflow: 'hidden', textOverflow: 'ellipsis' }}>{en.remarks || '—'}</td>
                    <td className="no-print">
                      <div style={{ display: 'flex', gap: 6 }}>
                        <button className="edm-btn edm-btn-ghost" style={{ padding: 6 }} onClick={() => setModal({ mode: 'edit', entry: en })}><Pencil size={13} /></button>
                        <button className="edm-btn edm-btn-danger-ghost" style={{ padding: 6 }} onClick={() => setDeleteId(en.id)}><Trash2 size={13} /></button>
                      </div>
                    </td>
                  </tr>
                );
              })}
              {visibleEntries.length === 0 && <tr><td colSpan={8} style={{ textAlign: 'center', color: 'var(--text-muted)', padding: 24 }}>{dayEntries.length === 0 ? 'No entries recorded for this date yet.' : 'No entries match the current filters.'}</td></tr>}
            </tbody>
          </table>
        </div>
      </div>

      {(modal?.mode === 'add' || modal?.mode === 'edit') && (
        <DailyEntryForm
          employees={employees}
          entries={entries}
          initial={modal.mode === 'edit' ? modal.entry : { id: uid(), date, company: COMPANIES[0], employeeId: '', assigned: '', delivered: '', failed: 0, remarks: '' }}
          onSave={upsertEntry}
          onClose={() => setModal(null)}
          onEditExisting={(existing) => setModal({ mode: 'edit', entry: existing })}
        />
      )}
      {monthModalOpen && (
        <MonthlyEntryForm
          employees={employees}
          entries={entries}
          setEntries={setEntries}
          empById={empById}
          onClose={() => setMonthModalOpen(false)}
        />
      )}
      {deleteId && (
        <Modal title="Delete entry" onClose={() => setDeleteId(null)} width={360}>
          <p style={{ fontSize: 13.5, color: 'var(--text-muted)', margin: '0 0 16px' }}>This removes the delivery record and adjusts all dependent reports. You'll have a few seconds to undo right after.</p>
          <div style={{ display: 'flex', gap: 10 }}>
            <button className="edm-btn" style={{ flex: 1, justifyContent: 'center', background: 'var(--danger)', color: '#fff' }} onClick={() => removeEntry(deleteId)}>Delete</button>
            <button className="edm-btn edm-btn-ghost" onClick={() => setDeleteId(null)}>Cancel</button>
          </div>
        </Modal>
      )}
      <UndoToast toast={toast} onDismiss={dismiss} />
    </div>
  );
}

function DailyEntryForm({ employees, entries, initial, onSave, onClose, onEditExisting }) {
  const COMPANIES = useContext(CompaniesContext);
  const [form, setForm] = useState(initial);
  const set = (k, v) => setForm((f) => ({ ...f, [k]: v }));
  const companyEmployees = employees.filter((e) => e.company === form.company && (e.status === 'Active' || e.id === initial.employeeId));
  const assigned = Number(form.assigned) || 0;
  const delivered = Math.min(assigned, Number(form.delivered) || 0);
  const rate = assigned ? (delivered / assigned) * 100 : 0;

  // Duplicate-entry protection: another entry for the same employee + date already exists.
  const duplicate = form.employeeId
    ? entries.find((en) => en.employeeId === form.employeeId && en.date === form.date && en.id !== initial.id)
    : null;
  const duplicateEmployee = duplicate ? employees.find((e) => e.id === duplicate.employeeId) : null;

  return (
    <Modal title={initial.employeeId && initial.assigned !== '' ? 'Edit delivery entry' : 'Add delivery entry'} onClose={onClose}>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12 }}>
          <div><label className="edm-label">Date</label><input type="date" className="edm-input" value={form.date} onChange={(e) => set('date', e.target.value)} /></div>
          <div>
            <label className="edm-label">Company</label>
            <select className="edm-select" value={form.company} onChange={(e) => { set('company', e.target.value); set('employeeId', ''); }}>
              {COMPANIES.map((c) => <option key={c} value={c}>{c}</option>)}
            </select>
          </div>
        </div>
        <div>
          <label className="edm-label">Employee</label>
          <select className="edm-select" value={form.employeeId} onChange={(e) => set('employeeId', e.target.value)}>
            <option value="">Select employee</option>
            {companyEmployees.map((e) => <option key={e.id} value={e.id}>{e.name}{e.status === 'Inactive' ? ' (inactive)' : ''}</option>)}
          </select>
        </div>
        {duplicate && (
          <div style={{ background: '#FDF1E7', border: '1px solid var(--amber)', borderRadius: 8, padding: '10px 12px', display: 'flex', flexDirection: 'column', gap: 8 }}>
            <span style={{ fontSize: 12.5, color: '#7A4A0A' }}>
              An entry for {duplicateEmployee ? duplicateEmployee.name : 'this employee'} on {form.date} already exists — edit that one instead of creating a duplicate.
            </span>
            <button className="edm-btn edm-btn-amber" style={{ alignSelf: 'flex-start', padding: '6px 12px' }} onClick={() => onEditExisting(duplicate)}>Edit existing entry</button>
          </div>
        )}
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12 }}>
          <div><label className="edm-label">Total products assigned</label><input type="number" min="0" className="edm-input" value={form.assigned} onChange={(e) => set('assigned', e.target.value)} placeholder="0" /></div>
          <div><label className="edm-label">Successfully delivered</label><input type="number" min="0" className="edm-input" value={form.delivered} onChange={(e) => set('delivered', e.target.value)} placeholder="0" /></div>
        </div>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', background: '#F7F8FA', borderRadius: 8, padding: '10px 12px' }}>
          <span style={{ fontSize: 12.5, color: 'var(--text-muted)' }}>Failed: <strong className="font-mono" style={{ color: 'var(--danger)' }}>{Math.max(0, assigned - delivered)}</strong></span>
          <RouteProgress percent={rate} width={100} />
        </div>
        <div><label className="edm-label">Remarks (optional)</label><input className="edm-input" value={form.remarks} onChange={(e) => set('remarks', e.target.value)} placeholder="Any notes for the day" /></div>
        <div style={{ display: 'flex', gap: 10, marginTop: 8 }}>
          <button
            className="edm-btn edm-btn-amber"
            style={{ flex: 1, justifyContent: 'center', opacity: duplicate ? 0.5 : 1, cursor: duplicate ? 'not-allowed' : 'pointer' }}
            disabled={!!duplicate}
            onClick={() => !duplicate && form.employeeId && form.assigned !== '' && onSave(form)}
          >
            Save entry
          </button>
          <button className="edm-btn edm-btn-ghost" onClick={onClose}>Cancel</button>
        </div>
      </div>
    </Modal>
  );
}

function MonthlyEntryForm({ employees, entries, setEntries, empById, onClose }) {
  const COMPANIES = useContext(CompaniesContext);
  const [company, setCompany] = useState('All');
  const [employeeId, setEmployeeId] = useState('');
  const [month, setMonth] = useState(toISO(today()).slice(0, 7));

  // Only active employees are offered here — this form is for logging ongoing daily deliveries,
  // and an inactive employee (already selected before, if any) is kept so the form doesn't break.
  const companyEmployees = employees.filter((e) => (company === 'All' || e.company === company) && (e.status === 'Active' || e.id === employeeId));

  const monthDates = useMemo(() => {
    const [y, m] = month.split('-').map(Number);
    const lastDay = new Date(y, m, 0).getDate();
    return Array.from({ length: lastDay }, (_, i) => toISO(new Date(y, m - 1, i + 1)));
  }, [month]);

  const buildRows = () => monthDates.map((date) => {
    const existing = employeeId ? entries.find((en) => en.employeeId === employeeId && en.date === date) : null;
    return {
      date,
      entryId: existing ? existing.id : null,
      assigned: existing ? String(existing.assigned) : '',
      delivered: existing ? String(existing.delivered) : '',
      remarks: existing ? existing.remarks : '',
    };
  });

  const [rows, setRows] = useState(buildRows);
  const [flash, setFlash] = useState({});

  useEffect(() => { setRows(buildRows()); }, [employeeId, month, entries.length]); // eslint-disable-line react-hooks/exhaustive-deps

  const setRow = (date, patch) => setRows((prev) => prev.map((r) => (r.date === date ? { ...r, ...patch } : r)));

  const saveRow = (date) => {
    const row = rows.find((r) => r.date === date);
    const emp = empById[employeeId];
    if (!row || !emp) return;
    if (row.assigned === '' && row.delivered === '' && !row.remarks) return;
    const assigned = Number(row.assigned) || 0;
    const delivered = Math.min(assigned, Number(row.delivered) || 0);
    const failed = Math.max(0, assigned - delivered);
    const record = { id: row.entryId || uid(), date, company: emp.company, employeeId, assigned, delivered, failed, remarks: row.remarks || '' };
    setEntries((prev) => {
      const idx = prev.findIndex((en) => en.id === record.id);
      if (idx >= 0) { const copy = [...prev]; copy[idx] = record; return copy; }
      return [...prev, record];
    });
    setRows((prev) => prev.map((r) => (r.date === date ? { ...r, entryId: record.id } : r)));
    setFlash((f) => ({ ...f, [date]: true }));
    setTimeout(() => setFlash((f) => ({ ...f, [date]: false })), 1400);
  };

  const monthAgg = useMemo(() => rows.reduce((acc, r) => {
    const assigned = Number(r.assigned) || 0;
    const delivered = Math.min(assigned, Number(r.delivered) || 0);
    acc.assigned += assigned; acc.delivered += delivered; acc.failed += Math.max(0, assigned - delivered);
    return acc;
  }, { assigned: 0, delivered: 0, failed: 0 }), [rows]);

  const monthLabel = fromISO(`${month}-01`).toLocaleDateString('en-IN', { month: 'long', year: 'numeric' });

  return (
    <Modal title="Monthly delivery entry (single employee)" onClose={onClose} width={720}>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
        <p style={{ fontSize: 12.5, color: 'var(--text-muted)', margin: 0 }}>
          Pick an employee and a month to fill in delivery numbers for every day at once — each row saves automatically as soon as you fill it in and click away.
        </p>
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: 12 }}>
          <div>
            <label className="edm-label">Company</label>
            <select className="edm-select" value={company} onChange={(e) => { setCompany(e.target.value); setEmployeeId(''); }}>
              <option value="All">All companies</option>
              {COMPANIES.map((c) => <option key={c} value={c}>{c}</option>)}
            </select>
          </div>
          <div>
            <label className="edm-label">Employee</label>
            <select className="edm-select" value={employeeId} onChange={(e) => setEmployeeId(e.target.value)}>
              <option value="">Select employee</option>
              {companyEmployees.map((e) => <option key={e.id} value={e.id}>{e.name}{e.status === 'Inactive' ? ' (inactive)' : ''}</option>)}
            </select>
          </div>
          <div>
            <label className="edm-label">Month</label>
            <input type="month" className="edm-input" value={month} onChange={(e) => setMonth(e.target.value)} />
          </div>
        </div>

        {!employeeId ? (
          <div style={{ padding: 24, textAlign: 'center', color: 'var(--text-muted)', fontSize: 13 }}>
            Select an employee to start entering daily deliveries for {monthLabel}.
          </div>
        ) : (
          <>
            <div style={{ display: 'flex', gap: 18, flexWrap: 'wrap', background: '#F7F8FA', borderRadius: 8, padding: '10px 12px' }}>
              <div><div className="edm-label">Assigned</div><div className="font-mono" style={{ fontWeight: 700 }}>{monthAgg.assigned}</div></div>
              <div><div className="edm-label">Delivered</div><div className="font-mono" style={{ fontWeight: 700, color: 'var(--teal-dark)' }}>{monthAgg.delivered}</div></div>
              <div><div className="edm-label">Failed</div><div className="font-mono" style={{ fontWeight: 700, color: 'var(--danger)' }}>{monthAgg.failed}</div></div>
            </div>
            <div className="edm-scroll" style={{ maxHeight: '46vh', overflowY: 'auto', border: '1px solid var(--border)', borderRadius: 8 }}>
              <table className="edm-table">
                <thead><tr>
                  <th>Date</th><th>Assigned</th><th>Delivered</th><th>Failed</th><th>Remarks</th><th style={{ width: 40 }}></th>
                </tr></thead>
                <tbody>
                  {rows.map((row) => {
                    const assigned = Number(row.assigned) || 0;
                    const delivered = Math.min(assigned, Number(row.delivered) || 0);
                    const failed = Math.max(0, assigned - delivered);
                    const label = fromISO(row.date).toLocaleDateString('en-IN', { weekday: 'short', day: '2-digit', month: 'short' });
                    return (
                      <tr key={row.date}>
                        <td style={{ fontWeight: 600, whiteSpace: 'nowrap' }}>{label}</td>
                        <td style={{ minWidth: 80 }}>
                          <input type="number" min="0" className="edm-input" style={{ padding: '5px 8px' }}
                            value={row.assigned}
                            onChange={(e) => setRow(row.date, { assigned: e.target.value })}
                            onBlur={() => saveRow(row.date)}
                            placeholder="0" />
                        </td>
                        <td style={{ minWidth: 80 }}>
                          <input type="number" min="0" className="edm-input" style={{ padding: '5px 8px' }}
                            value={row.delivered}
                            onChange={(e) => setRow(row.date, { delivered: e.target.value })}
                            onBlur={() => saveRow(row.date)}
                            placeholder="0" />
                        </td>
                        <td className="font-mono" style={{ color: 'var(--danger)' }}>{failed}</td>
                        <td style={{ minWidth: 140 }}>
                          <input className="edm-input" style={{ padding: '5px 8px' }}
                            value={row.remarks}
                            onChange={(e) => setRow(row.date, { remarks: e.target.value })}
                            onBlur={() => saveRow(row.date)}
                            placeholder="Notes" />
                        </td>
                        <td>
                          {flash[row.date]
                            ? <CheckCircle2 size={15} color="var(--teal-dark)" />
                            : (row.entryId ? <span style={{ fontSize: 11, color: 'var(--text-muted)' }}>Saved</span> : null)}
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </>
        )}

        <div style={{ display: 'flex', justifyContent: 'flex-end', marginTop: 4 }}>
          <button className="edm-btn edm-btn-ghost" onClick={onClose}>Close</button>
        </div>
      </div>
    </Modal>
  );
}

/* ---------------------------------- Revenue page (per company) ---------------------------------- */

function RevenuePage({ company, employees, entries, empById, rates }) {
  const [preset, setPreset] = useState('thisMonth');
  const [customStart, setCustomStart] = useState(toISO(today()));
  const [customEnd, setCustomEnd] = useState(toISO(today()));
  const [employeeFilter, setEmployeeFilter] = useState('All');

  const [start, end] = getRange(preset, customStart, customEnd);
  const companyEmployees = employees.filter((e) => e.company === company);
  const filtered = entries.filter((en) => en.company === company && inRange(en.date, start, end) && (employeeFilter === 'All' || en.employeeId === employeeFilter));

  const t = today();
  const dayAgg = aggregate(entries.filter((en) => en.company === company && en.date === toISO(t)), empById, rates);
  const weekAgg = aggregate(entries.filter((en) => en.company === company && inRange(en.date, startOfWeek(t), addDays(startOfWeek(t), 6))), empById, rates);
  const monthAgg = aggregate(entries.filter((en) => en.company === company && inRange(en.date, startOfMonth(t), endOfMonth(t))), empById, rates);
  const yearAgg = aggregate(entries.filter((en) => en.company === company && inRange(en.date, startOfYear(t), endOfYear(t))), empById, rates);

  const rangeAgg = aggregate(filtered, empById, rates);
  const trend = buildTrend(filtered, empById, rates, start, end);

  const empRevenue = companyEmployees.map((e) => {
    const es = filtered.filter((en) => en.employeeId === e.id);
    const a = aggregate(es, empById, rates);
    return { ...e, delivered: a.delivered, revenue: a.revenue };
  }).sort((a, b) => b.revenue - a.revenue);

  const tableControls = useTableControls();
  const revenueColumns = [
    { key: 'name', label: 'Employee', getValue: (e) => e.name, filterType: 'text' },
    { key: 'status', label: 'Status', getValue: (e) => e.status, filterType: 'select', filterOptions: ['Active', 'Inactive'] },
    { key: 'delivered', label: 'Delivered (range)', getValue: (e) => e.delivered, filterType: 'text' },
    { key: 'revenue', label: 'Revenue generated', getValue: (e) => e.revenue, filterType: 'text' },
  ];
  const visibleRevenue = tableControls.apply(empRevenue, revenueColumns);

  return (
    <div>
      <SectionHeader title={`${company} — revenue`} subtitle={`₹${rates.revenue[company]} per successful delivery`} />

      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, minmax(0,1fr))', gap: 14, marginBottom: 20 }}>
        <MetricCard label="Today" value={inr(dayAgg.revenue)} sub={`${dayAgg.delivered} delivered`} tone="teal" icon={TrendingUp} />
        <MetricCard label="This week" value={inr(weekAgg.revenue)} sub={`${weekAgg.delivered} delivered`} tone="teal" icon={TrendingUp} />
        <MetricCard label="This month" value={inr(monthAgg.revenue)} sub={`${monthAgg.delivered} delivered`} tone="teal" icon={TrendingUp} />
        <MetricCard label="This year" value={inr(yearAgg.revenue)} sub={`${yearAgg.delivered} delivered`} tone="teal" icon={TrendingUp} />
      </div>

      <FilterBar preset={preset} setPreset={setPreset} customStart={customStart} customEnd={customEnd} setCustomStart={setCustomStart} setCustomEnd={setCustomEnd}
        employeeFilter={employeeFilter} setEmployeeFilter={setEmployeeFilter} employees={companyEmployees} showCompany={false} />

      <div style={{ display: 'grid', gridTemplateColumns: '1fr 300px', gap: 16, marginBottom: 20 }}>
        <div className="edm-card" style={{ padding: 18 }}>
          <h3 className="font-display" style={{ fontSize: 15, fontWeight: 700, margin: '0 0 12px' }}>Revenue trend</h3>
          <div className="chart-box">
            <ResponsiveContainer width="100%" height="100%">
              <ComposedChart data={trend} margin={{ left: -10, right: 10 }}>
                <CartesianGrid stroke="#EEF0F2" vertical={false} />
                <XAxis dataKey="label" tick={{ fontSize: 11, fill: '#6B7280' }} axisLine={{ stroke: '#E4E6EA' }} tickLine={false} interval={Math.ceil(trend.length / 10)} />
                <YAxis tick={{ fontSize: 11, fill: '#6B7280' }} axisLine={false} tickLine={false} />
                <Tooltip formatter={(v) => inr(v)} contentStyle={{ fontSize: 12, borderRadius: 8, border: '1px solid #E4E6EA' }} />
                <Bar dataKey="revenue" name="Revenue" fill="#0E9488" radius={[3, 3, 0, 0]} maxBarSize={18} />
              </ComposedChart>
            </ResponsiveContainer>
          </div>
        </div>
        <div className="edm-card" style={{ padding: 18 }}>
          <h3 className="font-display" style={{ fontSize: 15, fontWeight: 700, margin: '0 0 14px' }}>Selected range</h3>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 10, fontSize: 13 }}>
            <div style={{ display: 'flex', justifyContent: 'space-between' }}><span style={{ color: 'var(--text-muted)' }}>Delivered</span><span className="font-mono" style={{ fontWeight: 600 }}>{rangeAgg.delivered}</span></div>
            <div style={{ display: 'flex', justifyContent: 'space-between' }}><span style={{ color: 'var(--text-muted)' }}>Rate / delivery</span><span className="font-mono" style={{ fontWeight: 600 }}>{inr(rates.revenue[company])}</span></div>
            <div style={{ borderTop: '1px solid var(--border)', margin: '4px 0' }} />

function VendorPage({ vendor, employees, entries, empById, rates, onManage }) {
  const [preset, setPreset] = useState('thisMonth');
  const [customStart, setCustomStart] = useState(toISO(today()));
  const [customEnd, setCustomEnd] = useState(toISO(today()));

  const [start, end] = getRange(preset, customStart, customEnd);
  const rangeLabel = start.getTime() === end.getTime()
    ? start.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' })
    : `${start.toLocaleDateString('en-IN', { day: '2-digit', month: 'short' })} – ${end.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' })}`;

  const assignedEmployees = employees.filter((e) => (vendor.employeeIds || []).includes(e.id));
  const activeCount = assignedEmployees.filter((e) => e.status === 'Active').length;
  const assignedIds = useMemo(() => new Set(vendor.employeeIds || []), [vendor.employeeIds]);

  const rangeEntries = entries.filter((en) => assignedIds.has(en.employeeId) && inRange(en.date, start, end));
  const rangeAgg = aggregate(rangeEntries, empById, rates);

  // Delivery numbers per employee, for the selected date range — this is what "calculation
  // details based on products delivered" refers to, both in the summary cards above and per row.
  const perEmployee = assignedEmployees.map((e) => {
    const es = rangeEntries.filter((en) => en.employeeId === e.id);
    return { ...e, ...aggregate(es, empById, rates) };
  });

  const tableControls = useTableControls();
  const columns = [
    { key: 'name', label: 'Employee', getValue: (e) => e.name, filterType: 'text' },
    { key: 'hubLocation', label: 'Hub location', getValue: (e) => e.hubLocation || '', filterType: 'text' },
    { key: 'status', label: 'Status', getValue: (e) => e.status, filterType: 'select', filterOptions: ['Active', 'Inactive'] },
    { key: 'assigned', label: 'Assigned', getValue: (e) => e.assigned, filterType: 'text' },
    { key: 'delivered', label: 'Delivered', getValue: (e) => e.delivered, filterType: 'text' },
    { key: 'failed', label: 'Failed', getValue: (e) => e.failed, filterType: 'text' },
    { key: 'successRate', label: 'Success %', getValue: (e) => e.successRate, filterType: 'text' },

  // Exports the vendor summary plus the per-employee delivery breakdown for the selected range.
  const exportVendorCsv = () => {
    const rows = [
      [vendor.name],
      ['Range', rangeLabel],
      [],
      ['Summary'],
      ['Rate per delivery (₹)', vendor.amount],
      ['Employees assigned', assignedEmployees.length],
      ['Active among them', activeCount],
      ['Products assigned', rangeAgg.assigned],
      ['Products delivered', rangeAgg.delivered],
      ['Amount payable (₹)', vendor.amount * rangeAgg.delivered],
      ['Failed', rangeAgg.failed],
      ['Success rate', pct(rangeAgg.successRate)],
      [],
      ['Employees'],
      ['Employee', 'Hub location', 'Status', 'Assigned', 'Delivered', 'Failed', 'Success %'],
      ...visibleList.map((e) => [e.name, e.hubLocation || '', e.status, e.assigned, e.delivered, e.failed, e.successRate.toFixed(1)]),
    ];
    downloadCsv(`vendor_${vendor.name.replace(/\s+/g, '_')}_${toISO(start)}_to_${toISO(end)}.csv`, rows);
  };

  return (
    <div>
      <SectionHeader
        title={vendor.name}
        subtitle={`${assignedEmployees.length} employee${assignedEmployees.length === 1 ? '' : 's'} assigned · ${activeCount} active`}
        right={
          <div style={{ display: 'flex', gap: 8 }}>
            <button className="edm-btn edm-btn-ghost" onClick={exportVendorCsv}><Download size={15} /> Export CSV</button>
            <button className="edm-btn edm-btn-ghost" onClick={onManage}><SettingsIcon size={15} /> Manage in Settings</button>
          </div>
        }
      />

      <FilterBar preset={preset} setPreset={setPreset} customStart={customStart} customEnd={customEnd} setCustomStart={setCustomStart} setCustomEnd={setCustomEnd}
        employeeFilter="All" setEmployeeFilter={() => {}} employees={[]} showEmployee={false} showCompany={false} />

      <div className="edm-card" style={{ padding: '10px 16px', marginBottom: 16, display: 'flex', alignItems: 'center', gap: 8, fontSize: 12.5, color: 'var(--text-muted)' }}>
        <ChevronRight size={13} /> Showing <strong style={{ color: 'var(--text)' }}>{rangeLabel}</strong>
      </div>

      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, minmax(0,1fr))', gap: 14, marginBottom: 14 }}>
        <MetricCard label="Employees assigned" value={assignedEmployees.length} icon={Users} tone="navy" />
        <MetricCard label="Active among them" value={activeCount} icon={CheckCircle2} tone="teal" />
        <MetricCard label="Rate per delivery" value={`${inr(vendor.amount)} /delivery`} icon={Wallet} tone="amber" />
      </div>

      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, minmax(0,1fr))', gap: 14, marginBottom: 20 }}>
        <MetricCard label="Amount payable to vendor" value={inr(vendor.amount * rangeAgg.delivered)} sub={`${inr(vendor.amount)} × ${rangeAgg.delivered} delivered`} icon={Wallet} tone="amber" />
        <MetricCard label="Products assigned" value={rangeAgg.assigned.toLocaleString('en-IN')} icon={Package} tone="navy" />
        <MetricCard label="Products delivered" value={rangeAgg.delivered.toLocaleString('en-IN')} sub={`of ${rangeAgg.assigned} assigned · ${pct(rangeAgg.successRate)} success`} icon={CheckCircle2} tone="teal" />
        <MetricCard label="Failed deliveries" value={rangeAgg.failed} icon={XCircle} tone="danger" />
      </div>

      <div className="edm-card edm-scroll" style={{ overflowX: 'auto' }}>
        <table className="edm-table">
          <SortFilterHead columns={columns} controls={tableControls} />
          <tbody>

              <tr key={e.id}>
                <td style={{ fontWeight: 600 }}>{e.name}</td>
                <td style={{ color: e.hubLocation ? 'var(--text)' : 'var(--text-muted)' }}>{e.hubLocation || '—'}</td>
                <td><StatusBadge status={e.status} /></td>
                <td className="font-mono">{e.assigned}</td>
                <td className="font-mono" style={{ color: 'var(--teal-dark)' }}>{e.delivered}</td>
                <td className="font-mono" style={{ color: 'var(--danger)' }}>{e.failed}</td>
                <td className="font-mono">{pct(e.successRate)}</td>
              </tr>
            ))}

              <tr><td colSpan={7} style={{ textAlign: 'center', color: 'var(--text-muted)', padding: 24 }}>
                {assignedEmployees.length === 0 ? 'No employees assigned to this vendor yet — add some from Settings.' : 'No employees match the current filters.'}
              </td></tr>
            )}
          </tbody>
        </table>
      </div>
    </div>
  );
}

/* ---------------------------------- Pay slips ---------------------------------- */

function periodLabelForRange(start, end) {
  if (toISO(start) === toISO(end)) {
    return start.toLocaleDateString('en-IN', { day: '2-digit', month: 'long', year: 'numeric' });
  }
  const sameMonth = start.getFullYear() === end.getFullYear() && start.getMonth() === end.getMonth();
  const fmtShort = (d) => d.toLocaleDateString('en-IN', { day: '2-digit', month: 'short' });
  const fmtFull = (d) => d.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });
  return sameMonth ? `${fmtShort(start)} – ${fmtFull(end)}` : `${fmtFull(start)} – ${fmtFull(end)}`;
}

// Generic payslip calculation over any date range. `periodType` is one of
// 'monthly' | 'weekly' | 'daily' | 'custom' and is used only for display/labels.
function computePayslipForRange(employee, entries, rates, start, end, periodType = 'custom') {
  const es = entries.filter((en) => en.employeeId === employee.id && inRange(en.date, start, end));
  const workingDays = es.length;
  const assigned = es.reduce((s, en) => s + en.assigned, 0);
  const delivered = es.reduce((s, en) => s + en.delivered, 0);
  const failed = es.reduce((s, en) => s + en.failed, 0);
  const structure = findSalaryStructure(rates, employee.salaryMethod);
  const { pay, petrol: petrolPerDay } = calcPayroll(delivered, employee, rates);
  const petrol = petrolPerDay * workingDays;
  const periodKey = toISO(start) === toISO(end) ? toISO(start) : `${toISO(start)}_to_${toISO(end)}`;
  return {
    employee, periodType, start, end,
    periodKey, periodLabel: periodLabelForRange(start, end),
    workingDays, assigned, delivered, failed,
    structureLabel: structure.label, perDeliveryRate: Number(structure.perDelivery) || 0,
    petrolPerDay, pay, petrol, total: pay + petrol,
  };
}

// Back-compat helper for a full calendar month.
function computePayslip(employee, entries, rates, monthStr) {
  const [start, end] = monthBounds(monthStr);
  return computePayslipForRange(employee, entries, rates, start, end, 'monthly');
}

function payslipNumber(slip) {
  return `CHRI-${slip.periodKey}-${String(slip.employee.id).toUpperCase()}`;
}

function printPayslip(slip) {
  // Browsers use the document title as the suggested filename when the
  // person chooses "Save as PDF" from the print dialog, so we temporarily
  // rename the tab to give every employee their own payslip filename,
  // e.g. CHRI_Payslip_EMP001_2026-06, then restore the original title.
  const previousTitle = document.title;
  document.title = `CHRI_Payslip_${slip.employee.id}_${slip.periodKey}`;
  const restore = () => { document.title = previousTitle; window.removeEventListener('afterprint', restore); };
  window.addEventListener('afterprint', restore);
  window.print();
  // Fallback in case the browser doesn't fire afterprint (e.g. some mobile browsers)
  setTimeout(restore, 5000);
}

function downloadPayslipCsv(slip) {
  const rows = [
    ['Pay slip', slip.periodLabel],
    ['Employee', slip.employee.name],
    ['Employee ID', slip.employee.id],
    ['Company', COMPANY_NAME],
    [],
    ['Working days', slip.workingDays],
    ['Parcels assigned', slip.assigned],
    ['Parcels delivered', slip.delivered],
    ['Returned to hub', slip.failed],
    [],
    ['Per-delivery rate (₹)', slip.perDeliveryRate],
    ['Payroll (piece rate) (₹)', slip.pay],
    ['Petrol allowance / day (₹)', slip.petrolPerDay],
    ['Petrol allowance total (₹)', slip.petrol],
    ['Net pay (₹)', slip.total],
  ];
  downloadCsv(`CHRI_Payslip_${slip.employee.id}_${slip.periodKey}.csv`, rows);
}

function downloadAllPayslipsCsv(employees, entries, rates, start, end, periodType, periodKey) {
  const header = ['Employee', 'Employee ID', 'Company', 'Working days', 'Assigned', 'Delivered', 'Returned', 'Per-delivery rate', 'Payroll', 'Petrol/day', 'Petrol total', 'Net pay'];
  const rows = employees.map((e) => {
    const s = computePayslipForRange(e, entries, rates, start, end, periodType);
    return [s.employee.name, s.employee.id, COMPANY_NAME, s.workingDays, s.assigned, s.delivered, s.failed, s.perDeliveryRate, s.pay, s.petrolPerDay, s.petrol, s.total];
  });
  downloadCsv(`payslips_${periodKey}.csv`, [header, ...rows]);
}

  const [weekAnchor, setWeekAnchor] = useState(toISO(today()));
  const [day, setDay] = useState(toISO(today()));
  const [customStart, setCustomStart] = useState(toISO(addDays(today(), -6)));
  const [customEnd, setCustomEnd] = useState(toISO(today()));
  const [employeeId, setEmployeeId] = useState(employees[0]?.id || '');
  const [companyFilter, setCompanyFilter] = useState('All');
  const [statusFilter, setStatusFilter] = useState('All');

  const list = employees.filter((e) => (companyFilter === 'All' || e.company === companyFilter) && (statusFilter === 'All' || e.status === statusFilter));
  const inactiveCount = employees.filter((e) => e.status === 'Inactive').length;
  const employee = list.find((e) => e.id === employeeId) || list[0];

  useEffect(() => {
    if (list.length && !list.find((e) => e.id === employeeId)) setEmployeeId(list[0].id);
  }, [companyFilter, statusFilter]);

  // Resolve the active [start, end] range and a display label based on the chosen period type.
  let start, end;
  if (periodType === 'monthly') { [start, end] = monthBounds(month); }
  else if (periodType === 'weekly') { start = startOfWeek(fromISO(weekAnchor)); end = addDays(start, 6); }
  else if (periodType === 'daily') { start = fromISO(day); end = fromISO(day); }
  else { start = fromISO(customStart); end = fromISO(customEnd) < start ? start : fromISO(customEnd); }

  const slip = employee ? computePayslipForRange(employee, entries, rates, start, end, periodType) : null;

  const shiftWeek = (delta) => setWeekAnchor(toISO(addDays(fromISO(weekAnchor), delta * 7)));
  const shiftDay = (delta) => setDay(toISO(addDays(fromISO(day), delta)));

  return (

        <div style={{ display: 'flex', gap: 8, marginBottom: 14, flexWrap: 'wrap' }}>

            { id: 'weekly', label: 'Weekly' },

          {['All', 'Active', 'Inactive'].map((s) => (
            <button key={s} className={`edm-btn ${statusFilter === s ? 'edm-btn-primary' : 'edm-btn-ghost'}`} onClick={() => setStatusFilter(s)}>
              {s}{s === 'Inactive' && inactiveCount > 0 ? ` (${inactiveCount})` : ''}
            </button>
          ))}
        </div>

        <div style={{ display: 'flex', flexWrap: 'wrap', gap: 10, alignItems: 'flex-end' }}>
          <div>
            <label className="edm-label">Company</label>
            <select className="edm-select" value={companyFilter} onChange={(e) => setCompanyFilter(e.target.value)}>
              <option value="All">All</option>
              {COMPANIES.map((c) => <option key={c} value={c}>{c}</option>)}
            </select>
          </div>
          <div>
            <label className="edm-label">Employee</label>
            <select className="edm-select" value={employee?.id || ''} onChange={(e) => setEmployeeId(e.target.value)}>
              {list.map((e) => <option key={e.id} value={e.id}>{e.name}{e.status === 'Inactive' ? ' (inactive)' : ''}</option>)}
            </select>
          </div>

          {periodType === 'monthly' && (
            <div style={{ display: 'flex', alignItems: 'flex-end', gap: 6 }}>
              <button className="edm-btn edm-btn-ghost" style={{ padding: '9px 10px' }} onClick={() => setMonth((m) => shiftMonthStr(m, -1))}>‹</button>
              <div>
                <label className="edm-label">Month</label>
                <input type="month" className="edm-input" value={month} onChange={(e) => setMonth(e.target.value)} />
              </div>
              <button className="edm-btn edm-btn-ghost" style={{ padding: '9px 10px' }} onClick={() => setMonth((m) => shiftMonthStr(m, 1))}>›</button>
            </div>
          )}

          {periodType === 'weekly' && (
            <div style={{ display: 'flex', alignItems: 'flex-end', gap: 6 }}>
              <button className="edm-btn edm-btn-ghost" style={{ padding: '9px 10px' }} onClick={() => shiftWeek(-1)}>‹</button>

              <button className="edm-btn edm-btn-ghost" style={{ padding: '9px 10px' }} onClick={() => shiftWeek(1)}>›</button>
              <div style={{ fontSize: 12, color: 'var(--text-muted)', paddingBottom: 9 }}>{periodLabelForRange(start, end)}</div>
            </div>

              <button className="edm-btn edm-btn-ghost" style={{ padding: '9px 10px' }} onClick={() => shiftDay(-1)}>‹</button>

              </div>

                <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
                  <img className="payslip-header-logo" src={LOGO_DATA_URI} alt="CHRI AGENCIES logo" />
                  <div>
                    <div className="font-display" style={{ fontSize: 19, fontWeight: 700, letterSpacing: '.02em' }}>{COMPANY_NAME}</div>
                    <div style={{ fontSize: 12, color: 'var(--text-muted)' }}>{COMPANY_TAGLINE}</div>
                    <div style={{ fontSize: 11, color: 'var(--text-muted)' }}>Delivery rider pay slip</div>
                  </div>
                </div>
                <div style={{ textAlign: 'right' }}>
                  <div className="font-display" style={{ fontSize: 15, fontWeight: 700 }}>{slip.periodLabel}</div>
                  <div style={{ fontSize: 12, color: 'var(--text-muted)' }}>Generated {toISO(today())}</div>

                This is a computer generated payslip and does not require a physical signature.
              </div>
            </div>
          </div>

      )}
    </div>
  );

function SalaryPage({ employees, entries, rates }) {
